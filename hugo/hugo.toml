baseURL = 'https://stotrasamhita.github.io/'
locale = 'en'
title = 'StotraSamhita'
disablePathToLower = true
# Deity, composer and metre are browse filters on /stotra/ rather than
# taxonomy pages.
disableKinds = ['taxonomy', 'term']

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = 'Sanskrit stotras, nāmāvalīs, pūjās and complete texts, proofread and typeset.'
  github = 'https://github.com/stotrasamhita'
  calendar = 'https://adyatithi.github.io/'
  # Public-domain Ravi Varma paintings stand in as covers for a few stotras
  # (data/placeholder_covers.yaml) until each stotra has its own cover.
  placeholderCovers = true
  # Pageview counts (no cookies): https://stotrasamhita.goatcounter.com/
  # Loaded only in production builds; GoatCounter also ignores localhost.
  goatcounter = 'https://stotrasamhita.goatcounter.com/count'


[outputs]
  home = ['html', 'rss']
  section = ['html']
