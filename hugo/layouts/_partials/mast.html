{{ $sec := .Section }}
<header class="mast"><div class="wrap">
  <a class="brand" href="/"><span class="deva">स्तोत्रसंहिता</span><span class="lat">StotraSamhita</span></a>
  <nav class="nav" aria-label="Sections">
    <a href="/stotra/"{{ if eq $sec "stotra" }} class="on" aria-current="page"{{ end }}>Stotras</a>
    <a href="/namavali/"{{ if eq $sec "namavali" }} class="on" aria-current="page"{{ end }}>Nāmāvalīs</a>
    <a href="/puja-vidhanam/"{{ if eq $sec "puja-vidhanam" }} class="on" aria-current="page"{{ end }}>Pūjā</a>
    <a href="/#collections">Collections</a>
    <a href="/major-books/"{{ if eq .Layout "books" }} class="on" aria-current="page"{{ end }}>Books</a>
    <a href="/individual-pdfs/"{{ if eq .Layout "pdfs" }} class="on" aria-current="page"{{ end }}>PDFs</a>
    <a href="{{ site.Params.calendar }}" rel="noopener">Calendar ↗</a>
  </nav>
  <form class="searchbox" action="/stotra/" role="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q-top" name="q" type="search" placeholder="Search कनकधारा, kanakadhara…" aria-label="Search stotras" autocomplete="off">
  </form>
  <button class="theme-btn" type="button" id="theme-btn" aria-label="Switch light or dark theme">
    <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div></header>
