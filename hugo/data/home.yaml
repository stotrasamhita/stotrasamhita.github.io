# Homepage picks. Slugs refer to stotra pages.
lead:
  slug: kanakadhara-stavam
  kicker: Featured
  subtitle: the hymn of the golden shower
  dek: >-
    A boy on his round of alms stops at a poor household. The woman has
    nothing to give but a single dried gooseberry. Moved by her gift,
    Śaṅkara sings to Lakṣmī on her behalf.
featured:
  - subrahmanya-bhujangam
  - ardhanarishwara-stotram
  - sharada-bhujangaprayata-ashtakam
  - balamukundashtakam

# Day of the week -> deity group (see deities.yaml), as commonly observed.
days:
  - {deva: रविवासरः, en: Sunday, g: Sūrya, note: "Sunday is the day of Sūrya. Many recite the Āditya-hṛdayam and other hymns to the Sun."}
  - {deva: सोमवासरः, en: Monday, g: Śiva, note: "Monday is the day of Śiva."}
  - {deva: मङ्गलवासरः, en: Tuesday, g: Subrahmaṇya, note: "Tuesday is kept for Subrahmaṇya, and for the Devī."}
  - {deva: बुधवासरः, en: Wednesday, g: Viṣṇu, note: "Wednesday is kept for Viṣṇu."}
  - {deva: गुरुवासरः, en: Thursday, g: Guru, note: "Thursday is the day of the Guru and Dakṣiṇāmūrti."}
  - {deva: शुक्रवासरः, en: Friday, g: Lakṣmī, note: "Friday is the day of Lakṣmī and the Devī."}
  - {deva: शनिवासरः, en: Saturday, g: Veṅkaṭeśa, note: "Saturday is kept for Veṅkaṭeśa, Hanumān and Śani."}

deities: [Gaṇeśa, Śiva, Devī, Lakṣmī, Sarasvatī, Viṣṇu, Kṛṣṇa, Rāma, Subrahmaṇya, Veṅkaṭeśa, Hanumān, Guru, Sūrya, Navagraha, Sacred rivers]
deity_covers: {Gaṇeśa: ganesha, Śiva: markandeya, Lakṣmī: lakshmi, Sarasvatī: saraswati, Viṣṇu: vishnu, Kṛṣṇa: krishna, Rāma: rama, Subrahmaṇya: murugan, Guru: dattatreya, Sacred rivers: ganga}

