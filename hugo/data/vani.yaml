"stotra/ganesha/gakaradi-ganapati-sahasranama-stotram": {"id": "YAiCdqOkmb8", "blurb": "The Gakārādi Gaṇapati Sahasranāma — a thousand names of Gaṇapati, every one beginning with the syllable 'ga', taught by Śiva. From the Rudrayāmala, in the Anuṣṭubh metre."}
