"stotra/ganesha/ganashtakam": {"id": "ZgSixw6R1DI", "blurb": "The Gaṇāṣṭakam — eight verses on Gaṇeśa, in the Anuṣṭubh metre."}
"stotra/ganesha/maha-ganesha-pancharatnam": {"id": "UzCKHtF2BBo", "blurb": "The Mahāgaṇeśa Pañcaratnam — five jewel-like verses on Gaṇeśa, composed by Ādi Śaṅkarācārya in the Pañcacāmara metre, beginning 'mudākarātta-modakam'."}
