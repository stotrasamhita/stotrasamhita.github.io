"stotra/guru/kanchi-kamakoti-guru-parampara-stava": {"id": "aT-j1vUZwYw", "blurb": "Śrī Kāñcī Kāmakoṭi Pīṭha, the Sarvajña Pīṭha at Kāñcīpuram, was established by Śrī Ādi Śaṅkara Bhagavatpāda (Kalyabda 2621, 482 BCE), and its unbroken line of Jagadgurus continues to this day under the 70th Pīṭhādhipati, Śrī Śaṅkara Vijayendra Sarasvatī Śaṅkarācārya Svāmigal, and his śiṣya, the 71st Jagadguru, Śrī Satya Candraśekharendra Sarasvatī Svāmigal. In this stava the 65th Jagadguru, Śrī Sudarśana Mahādevendra Sarasvatī Śrīcaraṇa, bows to that Guru-paramparā in simple Anuṣṭubh verses, recording some details not found in the earlier texts; the appendix verses (one of them by the 69th Jagadguru, Śrī Jayendra Sarasvatī Śrīpāda) salute the Jagadgurus who followed. It is one of the four traditional pramāṇa texts on the lineage, with the Puṇyaśloka-mañjarī (Śrī Sadāśiva Bodhendra Sarasvatī, the 56th Jagadguru), the Jagadguru-ratnamālā (Śrī Sadāśiva Brahmendra) and its commentary Suṣamā (Śrī Ātmabodhendra Sarasvatī). Each slide shows the ācārya's portrait with his verse; portraits from github.com/jyotisham/adyatithi. Closed captions are available in Telugu, Kannada, Tamil and Malayalam scripts (turn on CC and choose your language). Offered with prostrations at the feet of all the Jagadgurus."}
"stotra/guru/vyasashtakam": {"id": "nBeq2uRcDcg", "blurb": "The Vyāsāṣṭakam — eight verses in praise of Veda Vyāsa, in the Anuṣṭubh metre."}
"stotra/hanuman/apaduddharaka-dwadashamukha-hanuman-stotram": {"id": "XfB929PvPes", "blurb": "The Āpaduddhāraka Dvādaśamukha Hanumān Stotram — a hymn to twelve-faced Hanumān, the remover of distress, spoken by Vibhīṣaṇa. From the Sudarśana Saṁhitā."}
"stotra/hanuman/hanumat-pancharatnam": {"id": "QCLkaHMgKy0", "blurb": "The Hanumat Pañcaratnam — five verses on Hanumān, composed by Ādi Śaṅkarācārya."}
"stotra/hanuman/sundara-hanuman-maha-mantra-nama-stotram": {"id": "-g2bxiaLUXA", "blurb": "The Sundara-Hanumān Mahāmantra-nāma Stotram — names of Hanumān, in the Anuṣṭubh metre."}
"stotra/krishna/achyutashtakam": {"id": "F3DbGIG8nXA", "blurb": "The Acyutāṣṭakam — eight verses on Śrī Kṛṣṇa, composed by Ādi Śaṅkarācārya in the Sragviṇī metre, beginning 'acyutaṁ keśavaṁ rāma-nārāyaṇam'."}
