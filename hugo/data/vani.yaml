"stotra/krishna/bhishma-stuti": {"id": "F-DM-5QUIz0", "blurb": "The Bhīṣma Stuti from the Śrīmad Bhāgavatam — Bhīṣma's final praise of Śrī Kṛṣṇa from his bed of arrows."}
"stotra/krishna/damodarashtakam": {"id": "3hnHlugh33Y", "blurb": "The Dāmodarāṣṭakam, from the Padma Purāṇa, in the Bhujaṅgaprayāta metre, celebrates the child Kṛṣṇa bound to the mortar by Yaśodā."}
"stotra/krishna/dhruvakrta-bhagavat-stavam": {"id": "XD5Lmlo-9JQ", "blurb": "Dhruva's praise of the Lord, from the Śrīmad Bhāgavatam, in the Vasantatilakā metre — sung when Viṣṇu appeared before the child devotee."}
"stotra/krishna/govindashtakam": {"id": "jUYfgK8UMpw", "blurb": "The Govindāṣṭakam — eight verses on Śrī Kṛṣṇa as Govinda, composed by Ādi Śaṅkarācārya."}
