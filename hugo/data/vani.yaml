"stotra/krishna/balamukundashtakam": {"id": "oKLucaNGH34", "blurb": "The Bālamukundāṣṭakam — eight verses on the child Kṛṣṇa, beginning with the beloved image of the babe who places his lotus-foot in his lotus-mouth."}
