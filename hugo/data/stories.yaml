# Approved background stories, shown on the site under "About this stotra".
# Drafts awaiting review are in stories/drafts.yaml.
gita/gita/chapter-01:
  text: Chapter 1 of the Bhagavad Gītā, Arjuna-viṣāda-yoga. On the field of Kurukṣetra, Sañjaya describes
    to the blind king Dhṛtarāṣṭra the two armies arrayed for battle and the blowing of the conches. Arjuna
    asks Kṛṣṇa to draw his chariot between the armies, sees his teachers, kinsmen and friends on both
    sides, and overcome by grief and confusion, lays down his bow, refusing to fight.
gita/gita/chapter-02:
  text: 'Chapter 2 of the Bhagavad Gītā, Sāṅkhya-yoga. Arjuna surrenders to Kṛṣṇa as a disciple, and the
    teaching begins: the Self is never born and never dies, and is not slain when the body is slain; one''s
    own duty (svadharma) is to be done; action is to be performed without attachment to its fruits (karmaṇy
    evādhikāras te). The chapter closes with the portrait of the sthita-prajña, the person of steady wisdom.'
gita/gita/chapter-03:
  text: Chapter 3 of the Bhagavad Gītā, Karma-yoga. No one can remain without acting even for a moment;
    so act, but as an offering (yajña), without selfish attachment. Kṛṣṇa explains the cycle of sacrifice
    that sustains the world, the example the wise must set for others (loka-saṅgraha), that one's own
    duty imperfectly done is better than another's done well, and that desire born of rajas is the enemy
    to be conquered.
gita/gita/chapter-04:
  text: Chapter 4 of the Bhagavad Gītā, Jñāna-karma-sannyāsa-yoga. Kṛṣṇa reveals that this yoga was taught
    of old to Vivasvān, and that He takes birth age after age to protect the good and establish dharma
    (yadā yadā hi dharmasya). He teaches seeing inaction in action, describes the many forms of sacrifice,
    and declares knowledge the supreme purifier, to be gained by reverence, inquiry and service to the
    wise.
gita/gita/chapter-05:
  text: 'Chapter 5 of the Bhagavad Gītā, Karma-sannyāsa-yoga. Arjuna asks which is better, renouncing
    action or performing it. Kṛṣṇa answers that both lead to the highest, but action without attachment
    is superior: the yogī works like a lotus leaf untouched by water, sees the same Self in a learned
    brāhmaṇa, a cow, an elephant, a dog and an outcaste, and finds the peace of Brahman within.'
gita/gita/chapter-06:
  text: 'Chapter 6 of the Bhagavad Gītā, Ātma-saṁyama-yoga. Lift yourself by yourself — the mind is both
    friend and enemy. Kṛṣṇa describes the practice of meditation: the seat, the posture, moderation in
    food and sleep, the mind steady as a lamp in a windless place. To Arjuna''s doubt that the restless
    mind cannot be held, He answers: by practice and dispassion; and no one who does good ever comes to
    grief, even if the effort is left unfinished.'
gita/gita/chapter-07:
  text: 'Chapter 7 of the Bhagavad Gītā, Jñāna-vijñāna-yoga. Kṛṣṇa describes His lower nature (the eight
    elements of matter) and His higher nature (the life that sustains the world): all this is strung on
    Him like pearls on a thread. Four kinds of people worship Him — the distressed, the seeker of knowledge,
    the seeker of wealth, and the wise; the wise one, who after many births knows that Vāsudeva is all,
    is very rare.'
gita/gita/chapter-08:
  text: Chapter 8 of the Bhagavad Gītā, Akṣara-brahma-yoga. Arjuna asks what Brahman, adhyātma, karma,
    adhibhūta and adhidaiva are. Kṛṣṇa explains them and teaches that whatever one remembers at the moment
    of death, to that one goes — so remember Him at all times and fight. He describes the cycles of the
    days and nights of Brahmā, and the two paths by which souls depart.
gita/gita/chapter-09:
  text: 'Chapter 9 of the Bhagavad Gītā, Rāja-vidyā-rāja-guhya-yoga. The whole universe is pervaded by
    Kṛṣṇa''s unmanifest form, yet He stands apart. Whatever is offered with love — a leaf, a flower, a
    fruit, water (patraṁ puṣpaṁ phalaṁ toyam) — He accepts; whoever worships Him with undivided devotion,
    He carries their burden. Even the gravest sinner who turns to Him is soon righteous: ''My devotee
    never perishes.'''
gita/gita/chapter-10:
  text: Chapter 10 of the Bhagavad Gītā, Vibhūti-yoga. Kṛṣṇa declares Himself the source of all, and Arjuna
    praises Him as the Supreme Brahman and asks to hear His glories. Kṛṣṇa lists His chief manifestations
    — among the Ādityas Viṣṇu, among lights the sun, among rivers the Gaṅgā, among the Pāṇḍavas Arjuna
    — and concludes that whatever is glorious, beautiful or mighty springs from a spark of His splendour.
gita/gita/chapter-11:
  text: 'Chapter 11 of the Bhagavad Gītā, Viśvarūpa-darśana-yoga. Granted divine sight, Arjuna beholds
    Kṛṣṇa''s universal form — countless faces, eyes and arms, the radiance of a thousand suns — and sees
    the warriors of both armies rushing into His mouths. ''I am Time, the destroyer of worlds'': Arjuna
    is to be merely the instrument. Terrified and awed, Arjuna praises Him and begs to see again the gentle
    four-armed and human form. Much of this chapter is in the Triṣṭubh metre.'
gita/gita/chapter-12:
  text: Chapter 12 of the Bhagavad Gītā, Bhakti-yoga. Arjuna asks who is better — those who worship the
    personal Lord or the unmanifest Imperishable. Kṛṣṇa answers that both reach Him, but the path of the
    unmanifest is harder for the embodied; He gives a ladder of practice for those who cannot fix their
    mind on Him at once, and closes with the beloved qualities of His devotee — without hatred, friendly
    and compassionate, the same in honour and dishonour.
gita/gita/chapter-13:
  text: 'Chapter 13 of the Bhagavad Gītā, Kṣetra-kṣetrajña-vibhāga-yoga. The body is the field, and He
    who knows it is the knower of the field — and Kṛṣṇa is the knower in all fields. He lists the virtues
    that constitute knowledge, describes the Brahman that is to be known, and explains prakṛti and puruṣa:
    whoever sees the Lord dwelling equally in all beings, imperishable among the perishing, truly sees.'
gita/gita/chapter-14:
  text: 'Chapter 14 of the Bhagavad Gītā, Guṇa-traya-vibhāga-yoga. Kṛṣṇa explains how the three qualities
    of nature — sattva, rajas and tamas — bind the embodied soul: sattva by attachment to happiness and
    knowledge, rajas by attachment to action, tamas by delusion and sloth. Asked about the one who has
    transcended them, He describes the guṇātīta — equal in pleasure and pain, praise and blame — who serves
    Him with unwavering devotion.'
gita/gita/chapter-15:
  text: Chapter 15 of the Bhagavad Gītā, Puruṣottama-yoga. The world is an eternal aśvattha tree with
    roots above and branches below, to be cut down with the axe of detachment. Kṛṣṇa is the light of the
    sun and moon, the digestive fire in all beings, seated in every heart; beyond the perishable and the
    imperishable, He is the Supreme Person, the Puruṣottama. This short chapter is traditionally recited
    before meals.
gita/gita/chapter-16:
  text: Chapter 16 of the Bhagavad Gītā, Daivāsura-sampad-vibhāga-yoga. Kṛṣṇa lists the divine qualities
    that lead to liberation — fearlessness, purity, charity, self-control, non-violence, truthfulness,
    compassion — and the demoniac ones that lead to bondage — hypocrisy, arrogance, anger and harshness.
    Lust, anger and greed are the three gates of hell; so let the scripture be your authority in deciding
    what to do.
gita/gita/chapter-17:
  text: 'Chapter 17 of the Bhagavad Gītā, Śraddhā-traya-vibhāga-yoga. Faith takes the form of one''s nature:
    sāttvika, rājasa or tāmasa. Kṛṣṇa describes the three kinds of food, sacrifice, austerity (of body,
    speech and mind) and charity, and ends with the meaning of ''Om Tat Sat'', the threefold designation
    of Brahman.'
gita/gita/chapter-18:
  text: 'Chapter 18 of the Bhagavad Gītā, Mokṣa-sannyāsa-yoga. Kṛṣṇa distinguishes renunciation (sannyāsa)
    from relinquishment (tyāga), analyses knowledge, action, doer, intellect, resolve and happiness by
    the three guṇas, and teaches that one attains perfection by worshipping Him through one''s own duty.
    Then the final word: ''Abandon all dharmas and take refuge in Me alone; I will free you from all sins
    — do not grieve.'' Arjuna''s delusion is gone, and Sañjaya closes: where Kṛṣṇa and Arjuna are, there
    are fortune, victory and justice.'
gita/gsa:
  text: 'The Gītārtha-saṅgraha of Śrī Yāmunācārya (Āḷavandār), the great Śrīvaiṣṇava teacher: 32 verses
    summarising the meaning of the Bhagavad Gītā. It describes the Gītā''s aim as Nārāyaṇa, attainable
    only through devotion arising from one''s duty, knowledge and detachment; treats the three hexads
    of chapters (karma and jñāna yoga, bhakti yoga, and their synthesis); and gives the purport of each
    of the eighteen chapters in turn, ending with the four kinds of devotees and the glory of the jñānī.'
gita/mahatmyam:
  text: 'Seven verses on the greatness of the Gītā, traditionally chanted after the text: whoever reads
    this holy scripture with care attains the abode of Viṣṇu; a single bath in the waters of the Gītā
    washes away the dirt of saṁsāra; all the Upaniṣads are cows, the son of Nanda the milker, Arjuna the
    calf, and the Gītā the nectar-milk; one scripture, the song of Devakī''s son; one God, Devakī''s son;
    one mantra, His names; one duty, His service.'
gita/mahatmyam-varaha-puranam:
  text: 'The Gītā-māhātmyam of the Varāha Purāṇa. After verses of meditation on Varāha, the boar incarnation
    who raised the earth on his tusk, the goddess Earth (Dharā) asks Lord Viṣṇu how unwavering devotion
    can arise in one still bound by prārabdha karma. Viṣṇu answers with the glories of the Gītā: its student
    is liberated and happy, untouched by sin like a lotus leaf by water; wherever the Gītā is read, all
    holy places are present; ''the Gītā is My supreme abode; relying on its knowledge I sustain the three
    worlds''; and He describes the merit of reciting the whole, half, a chapter, or even a single verse.'
stotra/ganesha/gakaradi-ganapati-sahasranama-stotram:
  text: The Gakārādi Gaṇapati Sahasranāma — a thousand names of Gaṇapati, every one beginning with the
    syllable 'ga', taught by Śiva. From the Rudrayāmala, in the Anuṣṭubh metre.
stotra/ganesha/ganapati-stava:
  text: The Gaṇapati Stava, attributed to the sage Garga, in the Bhujaṅgaprayāta metre, praises Gaṇapati
    as the formless, changeless Supreme.
stotra/ganesha/ganashtakam:
  text: The Gaṇāṣṭakam — eight verses on Gaṇeśa, in the Anuṣṭubh metre.
stotra/ganesha/maha-ganesha-pancharatnam:
  text: The Mahāgaṇeśa Pañcaratnam — five jewel-like verses on Gaṇeśa, composed by Ādi Śaṅkarācārya in
    the Pañcacāmara metre, beginning 'mudākarātta-modakam'.
stotra/ganesha/mahaganapati-navarnavedapada-stava:
  text: The Mahāgaṇapati Navārṇa-vedapāda Stava — a hymn to Mahāgaṇapati, in the Anuṣṭubh metre.
stotra/ganesha/vakratunda-mahaganapati-sahasranama-stotram:
  text: The Vakratuṇḍa Mahāgaṇapati Sahasranāma — a thousand names of Gaṇeśa, from the Gaṇeśa Purāṇa.
stotra/guru/kanchi-kamakoti-guru-parampara-stava:
  text: Śrī Kāñcī Kāmakoṭi Pīṭha, the Sarvajña Pīṭha at Kāñcīpuram, was established by Śrī Ādi Śaṅkara
    Bhagavatpāda (Kalyabda 2621, 482 BCE), and its unbroken line of Jagadgurus continues to this day under
    the 70th Pīṭhādhipati, Śrī Śaṅkara Vijayendra Sarasvatī Śaṅkarācārya Svāmigal, and His śiṣya, the
    71st Jagadguru, Śrī Satya Candraśekharendra Sarasvatī Svāmigal. In this stava the 65th Jagadguru,
    Śrī Sudarśana Mahādevendra Sarasvatī Śrīcaraṇa, bows to that Guru-paramparā in simple Anuṣṭubh verses,
    recording some details not found in the earlier texts; the appendix verses (one of them by the 69th
    Jagadguru, Śrī Jayendra Sarasvatī Śrīpāda) salute the Jagadgurus who followed. It is one of the four
    traditional pramāṇa texts on the lineage, with the Puṇyaśloka-mañjarī (Śrī Sadāśiva Bodhendra Sarasvatī,
    the 56th Jagadguru), the Jagadguru-ratnamālā (Śrī Sadāśiva Brahmendra) and its commentary Suṣamā (Śrī
    Ātmabodhendra Sarasvatī).
stotra/guru/vyasashtakam:
  text: The Vyāsāṣṭakam — eight verses in praise of Veda Vyāsa, in the Anuṣṭubh metre.
stotra/hanuman/apaduddharaka-dwadashamukha-hanuman-stotram:
  text: The Āpaduddhāraka Dvādaśamukha Hanumān Stotram — a hymn to twelve-faced Hanumān, the remover of
    distress, spoken by Vibhīṣaṇa. From the Sudarśana Saṁhitā.
stotra/hanuman/hanumat-pancharatnam:
  text: The Hanumat Pañcaratnam — five verses on Hanumān, composed by Ādi Śaṅkarācārya.
stotra/hanuman/sundara-hanuman-maha-mantra-nama-stotram:
  text: The Sundara-Hanumān Mahāmantra-nāma Stotram — names of Hanumān, in the Anuṣṭubh metre.
stotra/krishna/achyutashtakam:
  text: The Acyutāṣṭakam — eight verses on Śrī Kṛṣṇa, composed by Ādi Śaṅkarācārya in the Sragviṇī metre,
    beginning 'acyutaṁ keśavaṁ rāma-nārāyaṇam'.
stotra/krishna/akrurakrta-dashavatara-stuti:
  text: From the Śrīmad Bhāgavatam (Skandha 10, Adhyāya 40). Kaṃsa has sent Akrūra to Vraja to bring Kṛṣṇa
    and Balarāma to Mathurā. On the way back, Akrūra stops at the Yamunā for his midday bath, and under
    the water he sees the two boys; looking again, he sees Viṣṇu reclining on Ādiśeṣa, attended by sages
    and devas. Overwhelmed, he praises the Lord, and in these six verses he salutes Him in each of His
    avatāras, from Matsya to Kalki.
stotra/krishna/balamukundashtakam:
  text: The Bālamukundāṣṭakam — eight verses on the child Kṛṣṇa, beginning with the beloved image of the
    baby who places His lotus-foot in His lotus-mouth.
stotra/krishna/balaraksha:
  text: 'From the Śrīmad Bhāgavatam (Skandha 10, Adhyāya 6). The infant Kṛṣṇa has just slain the demoness
    Pūtanā, who came to Gokula to nurse Him with poisoned milk. Shaken, the gopīs guard the child as mothers
    do: they wave a cow''s tail over Him, bathe Him and mark His limbs, and place the Lord''s names on
    each part of His body (“May Aja protect your feet, Maṇimān your knees…”), praying that every harm
    flee at the sound of Viṣṇu''s names. Here those protective verses are preceded by a few dhyāna-ślokas.'
stotra/krishna/bhishma-stavaraja:
  text: The Bhīṣma Stavarāja — the 'king of hymns' sung by Bhīṣma to Śrī Kṛṣṇa from his bed of arrows.
    From the Mahābhārata.
stotra/krishna/bhishma-stuti:
  text: 'From the Śrīmad Bhāgavatam (Skandha 1, Adhyāya 9). The war is over. Bhīṣma lies on his bed of
    arrows at Kurukṣetra, waiting for the sun to turn north before he gives up his body. Yudhiṣṭhira comes
    with his brothers and Śrī Kṛṣṇa, and after Bhīṣma has taught him dharma, the moment arrives. Gazing
    at Kṛṣṇa standing before him, Bhīṣma offers this praise: he recalls the Lord as Arjuna''s charioteer,
    His face dusted by the battle, and the time He broke His own vow and rushed at Bhīṣma wheel in hand
    to keep His devotee''s word. Then, his mind fixed on Kṛṣṇa, he sheds his mortal coil.'
stotra/krishna/damodarashtakam:
  text: The Dāmodarāṣṭakam, from the Padma Purāṇa, in the Bhujaṅgaprayāta metre, celebrates the child
    Kṛṣṇa bound to the mortar by Yaśodā.
stotra/krishna/dhruvakrta-bhagavat-stavam:
  text: From the Śrīmad Bhāgavatam (Skandha 4, Adhyāya 9), in the Vasantatilakā metre. The five-year-old
    prince Dhruva, turned away from his father's lap by his stepmother Suruci, goes to the forest of Madhuvana
    and, on Nārada's instruction, worships Viṣṇu with severe penance. When the Lord appears before him
    on Garuḍa, the child stands with folded hands, unable to speak. Viṣṇu touches his cheek with His conch,
    and at once the words of this praise flow from him.
stotra/krishna/govindashtakam:
  text: The Govindāṣṭakam — eight verses on Śrī Kṛṣṇa as Govinda, composed by Ādi Śaṅkarācārya.
stotra/krishna/guruvatapurisha-pancharatnam:
  text: The Guruvātapurīśa Pañcaratnam — five verses on the Lord of Guruvāyūr, composed by Anantarāma
    Dīkṣita.
stotra/krishna/krishna-dwadasha-nama-stotram:
  text: The Kṛṣṇa Dvādaśa-nāma Stotram — twelve names of Śrī Kṛṣṇa, from the Mahābhārata, in the Anuṣṭubh
    metre.
stotra/krishna/krishna-jananam:
  text: 'From the Śrīmad Bhāgavatam (Skandha 10, Adhyāya 3). At midnight, in Kaṃsa''s prison at Mathurā,
    Kṛṣṇa is born to Devakī and Vasudeva, and all nature rejoices. Vasudeva beholds the wondrous child:
    lotus-eyed and four-armed, holding the conch, discus, mace and lotus, with the Śrīvatsa on His chest
    and the Kaustubha at His throat, shining in yellow silk, crown and earrings.'
stotra/krishna/krishna-nama-mahatmyam:
  text: 'From the Skanda Purāṇa (Vaiṣṇava-khaṇḍa), in the Mārgaśīrṣa-māhātmya, where the Lord teaches
    Brahmā the observances of Mārgaśīrṣa, the month He calls His own in the Gītā (“māsānāṃ mārgaśīrṣo''ham”).
    In this fifteenth chapter He tells His son a secret dearer to Him than the rest: of all His names,
    “Kṛṣṇa, Kṛṣṇa” pleases Him most. Whoever remembers Him by it, He lifts out of hell as a lotus rises
    through water; even said in jest, in pretence or at the hour of death, it keeps Yama far away. The
    name is the rain-cloud that quenches the fire of sin and the fire that burns the serpent of Kali;
    it is as holy as the Gaṅgā at Prayāga or the Sarasvatī at Kurukṣetra, and a home where it is sung
    each day is itself Gayā, Kāśī and Puṣkara. The chapter ends with a promise to whoever reads it at
    dawn, or at the three sandhyās.'
stotra/krishna/krishnashtakam1:
  text: A Kṛṣṇāṣṭakam — eight verses composed by Ādi Śaṅkarācārya in the Śikhariṇī metre.
stotra/krishna/krishnashtakam2:
  text: A Kṛṣṇāṣṭakam — eight verses on Śrī Kṛṣṇa, composed by Ādi Śaṅkarācārya.
stotra/krishna/krishnashtakam3:
  text: The popular Kṛṣṇāṣṭakam — 'vasudeva-sutaṁ devam' — eight verses ending 'kṛṣṇaṁ vande jagadgurum',
    in the Anuṣṭubh metre.
stotra/krishna/narayana-keshadipadanta-varnanam:
  text: 'The hundredth and last daśaka of the Nārāyaṇīyam, Melpattūr Nārāyaṇa Bhaṭṭatiri''s retelling
    of the Bhāgavatam in a little over a thousand verses (as its last verse says), composed before Guruvāyūrappan.
    Tradition holds that Bhaṭṭatiri took on his guru Acyuta Piṣāraṭi''s crippling rheumatism, and sought
    relief at Guruvāyūr by offering a daśaka of about ten verses each day, the Lord nodding His assent
    to each. On the hundredth day, with the story told, the Lord appears to him. “Agre paśyāmi tejaḥ”:
    he sees a light before him, and within it a youthful divine form, surrounded by Nārada and the sages
    and by the Upaniṣads as radiant maidens. He then describes the vision from the crown of the head to
    the feet (keśādi-pāda), and ends asking forgiveness for whatever he has said without knowing the Lord''s
    greatness. The closing words, “āyur-ārogya-saukhyam” (long life, health and happiness), are both the
    poem''s blessing to its readers and, read as a chronogram, the day of its completion; and by tradition,
    with the last verse his illness left him.'
stotra/krishna/santanagopala-stotram:
  text: The Santāna Gopāla Stotram, in the Anuṣṭubh metre, is a prayer to Śrī Kṛṣṇa as Gopāla for the
    blessing of children.
stotra/lakshmi/kanakadhara-stavam:
  text: The Kanakadhārā Stavam — composed by Ādi Śaṅkarācārya in the Vasantatilakā metre, at whose recitation
    Goddess Lakṣmī is said to have showered golden fruits on a poor household.
stotra/lakshmi/lakshmi-stotram:
  text: Indra's praise of Goddess Lakṣmī, from the Viṣṇu Purāṇa, in the Anuṣṭubh metre.
stotra/lakshmi/mahalakshmi-stuti:
  text: Agastya's praise of Goddess Mahālakṣmī, largely in the Vasantatilakā metre.
stotra/lakshmi/mahalakshmyashtakam:
  text: The Mahālakṣmyaṣṭakam — eight verses on Goddess Mahālakṣmī, spoken by Indra, from the Padma Purāṇa,
    in the Anuṣṭubh metre.
stotra/nadi/ganga-stuti:
  text: 'From the Skanda Purāṇa (Kāśī-khaṇḍa), a stuti spoken by Brahmā, recited on Gaṅgā Daśaharā, the
    tenth day of the bright fortnight of Jyeṣṭha, when the Gaṅgā came down to earth. “Daśaharā” is “she
    who takes away ten”: bathing in the Gaṅgā and chanting this hymn before her on that day frees one
    from the ten kinds of sin, gathered over ten births, and lifts ten generations before and ten after
    from hell. The Varṣakṛtya-dīpikā lists the ten:


    - **Of the body (three):** taking what is not given; harming others in ways the scriptures do not
    sanction; coveting another''s wife.

    - **Of speech (four):** harsh words; untruth; tale-bearing and slander; idle, senseless talk.

    - **Of the mind (three):** coveting what belongs to others; wishing others ill; clinging to what is
    false.'
stotra/nadi/gangakarshanashtakam:
  text: 'The Gaṅgākarṣaṇāṣṭakam, “the eight verses that drew the Gaṅgā”, by Śrīdhara Veṅkaṭeśa Ayyāvāḷ
    of Tiruviśanallūr, the seventeenth-century saint of the nāma-siddhānta. On the day of his father''s
    śrāddha, Ayyāvāḷ saw a starving outcaste and gave him the food made ready for the rite. The brāhmaṇas
    called it a sin and would perform the śrāddha only if he first bathed in the Gaṅgā. Ayyāvāḷ, who could
    not go to Kāśī, turned instead to Śiva, the bearer of the Gaṅgā, with these verses: “I am no ascetic,
    no descendant of Sagara… Śambhu, open your matted locks.” The Gaṅgā welled up in the well of his house
    and flowed through the street, and the last verses record the wonder: “How does the flood surge here
    in this well? Surely the Lord is pleased with me… May this stream of compassion, risen from the well,
    purify the people here for ever.” Every year on the Kārttika amāvāsyā, devotees bathe in that well
    at Tiruviśanallūr.'
stotra/nadi/gangashtakam:
  text: The Gaṅgāṣṭakam — eight verses in praise of the holy river Gaṅgā.
stotra/nadi/kaveri-prarthana:
  text: A short prayer to the river Kāverī, in the Anuṣṭubh metre.
stotra/nadi/narmadashtakam:
  text: The Narmadāṣṭakam — composed by Ādi Śaṅkarācārya in the Pañcacāmara metre, with its flowing refrain
    'tvadīya pāda-paṅkajaṁ namāmi devi narmade'.
stotra/nadi/triveni-stotram:
  text: A hymn to the Triveṇī, the confluence of the Gaṅgā, Yamunā and Sarasvatī.
stotra/nadi/yamunashtakam:
  text: The Yamunāṣṭakam — eight verses in praise of the river Yamunā.
stotra/navagraha/aditya-hrdayam:
  text: The Āditya Hṛdayam — the hymn to the Sun that the sage Agastya taught Śrī Rāma on the battlefield
    before His final battle with Rāvaṇa. From the Śrīmad Rāmāyaṇa, in the Anuṣṭubh metre.
stotra/navagraha/surya-sahasranama-stotram:
  text: 'A thousand names of the Sun, from the Bhaviṣya Purāṇa, given in answer to King Śatānīka, who
    asks to hear the names by which the Sun god himself once appeared before the teller; the teller has
    them from Vyāsa. Among the closing names is a beautiful line: *sandhyā-rāga-karaḥ siddhaḥ sandhyā-vandana-vanditaḥ*,
    “he who paints the twilight sky red, and who is worshipped in the Sandhyāvandana.” The Sun to whom
    we offer arghya at dawn and dusk is the deity of the rite itself. The phala-śruti promises freedom
    from fear and disease, a hundred years of life, and victory to one who recites it daily.'
stotra/other/svadha-stotram:
  text: From the Devī Bhāgavatam (Skandha 9, Adhyāya 44), in the Anuṣṭubh metre, where Nārāyaṇa tells
    Nārada the story of Svadhā, the goddess through whom offerings reach the Pitṛs. When the ancestors
    went hungry because their offerings did not reach them, Brahmā meditated on the Devī and Svadhā appeared;
    this is the praise with which Brahmā honoured her. Whoever listens to it, the text says, gains the
    merit of bathing in every tīrtha.
stotra/other/yamashtakam:
  text: The Yamāṣṭakam — Sāvitrī's hymn to Yama, from the Brahmavaivarta Purāṇa, in the Anuṣṭubh metre.
stotra/rama/gayatri-ramayanam:
  text: The Gāyatrī Rāmāyaṇam — twenty-four verses of Vālmīki's Rāmāyaṇa, one for each syllable of the
    Gāyatrī mantra, in the Anuṣṭubh metre.
stotra/rama/munikrta-rama-stotram:
  text: The praise of Śrī Rāma by the sages, from the Skanda Purāṇa, in the Anuṣṭubh metre.
stotra/rama/rama-bhujangaprayata-stotram:
  text: A hymn to Śrī Rāma composed by Ādi Śaṅkarācārya in the Bhujaṅgaprayāta metre, beginning with Rāma
    as the pure, supreme Sat-cit-ānanda.
stotra/rama/rama-dwadasha-nama-stotram:
  text: Twelve names of Śrī Rāma, taught by Śiva, from the Skanda Purāṇa, in the Anuṣṭubh metre.
stotra/rama/rama-stava:
  text: Śiva's praise of Śrī Rāma.
stotra/rama/rama-stavaraja-stotram:
  text: The Rāma Stavarāja — the 'king of hymns' to Śrī Rāma, taught by Nārada, in the Anuṣṭubh metre.
stotra/rama/ramaraksha-stotram:
  text: The Rāmarakṣā Stotram of Budha Kauśika — a protective hymn to Śrī Rāma, beloved for its many-coloured
    names of Rāma.
stotra/rama/ramashtakam:
  text: The Rāmāṣṭakam, attributed to Veda Vyāsa, in the Pramāṇikā metre, beginning 'bhaje viśeṣa-sundaram'.
stotra/rama/sankshepa-ramayanam:
  text: The Saṅkṣepa Rāmāyaṇam — the whole story of Śrī Rāma in brief, as Nārada told it to Vālmīki at
    the beginning of the Rāmāyaṇa.
stotra/rama/sita-rama-stotram:
  text: The Sītā-Rāma Stotram, attributed to Hanumān, in the Anuṣṭubh metre — every verse praises Rāma
    and Sītā together.
stotra/saraswati/saraswati-sahasranama-stotram:
  text: The Sarasvatī Sahasranāma — a thousand names of Goddess Sarasvatī, taught by Sanatkumāra. From
    the Skanda Purāṇa, in the Anuṣṭubh metre.
stotra/shatanama/surya-ashtottara-shatanama-stotram:
  text: From the Vana Parva of the Mahābhārata. The Pāṇḍavas are in exile in the forest, and the many
    brāhmaṇas who have followed them must be fed, but Yudhiṣṭhira has nothing to give. The family priest,
    the sage Dhaumya, teaches him these 108 names of Sūrya. Yudhiṣṭhira worships the Sun with them, the
    Sun appears before him, and gives him the Akṣaya-pātra, the vessel that never runs out until Draupadī
    has eaten for the day.
stotra/shatanama/venkatesha-ashtottara-shatanama-stotram:
  text: 'The 108 names of Lord Veṅkaṭeśa, especially dear on the Saturdays of Purattāsi, hold a secret:
    take the first syllable of each name, in order, and together they spell a mantra, “oṃ namo veṅkaṭeśāya
    … śrīṃ klīṃ sauṃ … namo nārāyaṇa te svāhā”. The bīja syllables śrīṃ, klīṃ and sauṃ stand as names
    in the stotra itself.'
stotra/shiva/charanashringarahita-nataraja-stotram:
  text: 'The Caraṇa-śṛṅga-rahita Naṭarāja Stotram: ten verses to the dancing Śiva of Chidambaram, attributed
    to the sage Patañjali, traditionally the divine serpent Ādiśeṣa. The closing verse calls it the work
    of "the best of serpents" (*bhujaga-puṅgava*) and describes it as "without foot or horn" (*caraṇa-śṛṅga-rahitam*).


    True to its name, the hymn has no long vowel at all: no ā, ī, ū, e, ai, o or au, the signs that in
    Devanāgarī carry a "foot" or a "horn". Heavy syllables are made with anusvāra and conjuncts instead,
    which gives the verses their jingling, rolling gait: *sadañcita-mudañcita-nikuñcita-padaṃ…*


    Why "without feet and horns"? The traditional account is that Nandi, Śiva''s bull, who has both feet
    and horns, would not let Patañjali, who has neither, in to see the Lord. Patañjali answered by singing
    a hymn with neither. Some tellings give the role to Vyāghrapāda, the tiger-footed sage. We have not
    found this story in an early text. The scholar-monk Swami Kāśikānanda Giri, in his Sanskrit commentary,
    reads the name another way: "without beginning or end", like Śiva himself, whose pillar of fire Brahmā
    and Viṣṇu could never measure.'
stotra/shiva/rudra-stotram:
  text: 'From the Mahābhārata (Droṇa Parva, Pratijñā Parva, chapter 80). After Abhimanyu''s death Arjuna
    vows to slay Jayadratha before the next sunset or enter the fire. That night, in a vision, Śrī Kṛṣṇa
    takes him to Kailāsa to seek Śiva''s weapon, and together they praise Mahādeva with this hymn, calling
    him the blue-throated, the bearer of Pināka and the trident, the matted-haired lord with the bull
    on his banner, the golden-hued husband of Ambikā, the thousand-eyed. Sañjaya closes: “Having praised
    Mahādeva thus, Vāsudeva with Arjuna propitiated Bhava to obtain the weapon.”'
stotra/shiva/shiva-manasapuja:
  text: 'Ādi Śaṅkarācārya''s worship of Śiva performed entirely in the mind. Verse by verse it offers
    each of the upacāras in imagination: a jewelled seat, a bath in cool Himalayan water, divine garments,
    sandal paste, jasmine, campaka and bilva flowers, incense and lamp; then food in a golden vessel,
    tāmbūla, the parasol and the cāmara, the mirror, the music of the vīṇā, bherī and mṛdaṅga, song and
    dance, full prostration and praise. The fourth verse turns the whole of life into the pūjā: “You are
    my Self, Girijā my intellect, my prāṇas your attendants, my body your temple. Every enjoyment is your
    worship and sleep is samādhi; every step I walk is a pradakṣiṇa and every word I speak a hymn. Whatever
    I do, Śambhu, all of it is Your worship.” The last verse asks forgiveness for every fault of hand
    and foot, speech and body, done or left undone.'
stotra/shiva/shiva-sahasranama-stotram--vishnu-krtam:
  text: From the Liṅga Purāṇa (Pūrva-bhāga, chapter 98). To gain a weapon against the asuras, Viṣṇu worships
    Śiva with a thousand names, offering a lotus at each name. When one lotus is found missing, he offers
    his own lotus-like eye in its place; pleased, Śiva gives him the Sudarśana cakra. It is a favourite
    on Pradoṣa evenings.
