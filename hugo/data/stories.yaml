# Approved background stories, shown on the site under "About this stotra".
# Drafts awaiting review are in stories/drafts.yaml.
gita/gita/chapter-01:
  text: Chapter 1 of the Bhagavad Gītā, Arjuna-viṣāda-yoga. On the field of Kurukṣetra, Sañjaya describes
    to the blind king Dhṛtarāṣṭra the two armies arrayed for battle and the blowing of the conches. Arjuna
    asks Kṛṣṇa to draw his chariot between the armies, sees his teachers, kinsmen and friends on both
    sides, and overcome by grief and confusion, lays down his bow, refusing to fight.
gita/gita/chapter-02:
  text: 'Chapter 2 of the Bhagavad Gītā, Sāṅkhya-yoga. Arjuna surrenders to Kṛṣṇa as a disciple, and the
    teaching begins: the Self is never born and never dies, and is not slain when the body is slain; one''s
    own duty (svadharma) is to be done; action is to be performed without attachment to its fruits (karmaṇy
    evādhikāras te). The chapter closes with the portrait of the sthita-prajña, the person of steady wisdom.'
gita/gita/chapter-03:
  text: Chapter 3 of the Bhagavad Gītā, Karma-yoga. No one can remain without acting even for a moment;
    so act, but as an offering (yajña), without selfish attachment. Kṛṣṇa explains the cycle of sacrifice
    that sustains the world, the example the wise must set for others (loka-saṅgraha), that one's own
    duty imperfectly done is better than another's done well, and that desire born of rajas is the enemy
    to be conquered.
gita/gita/chapter-04:
  text: Chapter 4 of the Bhagavad Gītā, Jñāna-karma-sannyāsa-yoga. Kṛṣṇa reveals that this yoga was taught
    of old to Vivasvān, and that He takes birth age after age to protect the good and establish dharma
    (yadā yadā hi dharmasya). He teaches seeing inaction in action, describes the many forms of sacrifice,
    and declares knowledge the supreme purifier, to be gained by reverence, inquiry and service to the
    wise.
gita/gita/chapter-05:
  text: 'Chapter 5 of the Bhagavad Gītā, Karma-sannyāsa-yoga. Arjuna asks which is better, renouncing
    action or performing it. Kṛṣṇa answers that both lead to the highest, but action without attachment
    is superior: the yogī works like a lotus leaf untouched by water, sees the same Self in a learned
    brāhmaṇa, a cow, an elephant, a dog and an outcaste, and finds the peace of Brahman within.'
gita/gita/chapter-06:
  text: 'Chapter 6 of the Bhagavad Gītā, Ātma-saṁyama-yoga. Lift yourself by yourself — the mind is both
    friend and enemy. Kṛṣṇa describes the practice of meditation: the seat, the posture, moderation in
    food and sleep, the mind steady as a lamp in a windless place. To Arjuna''s doubt that the restless
    mind cannot be held, He answers: by practice and dispassion; and no one who does good ever comes to
    grief, even if the effort is left unfinished.'
gita/gita/chapter-07:
  text: 'Chapter 7 of the Bhagavad Gītā, Jñāna-vijñāna-yoga. Kṛṣṇa describes His lower nature (the eight
    elements of matter) and His higher nature (the life that sustains the world): all this is strung on
    Him like pearls on a thread. Four kinds of people worship Him — the distressed, the seeker of knowledge,
    the seeker of wealth, and the wise; the wise one, who after many births knows that Vāsudeva is all,
    is very rare.'
gita/gita/chapter-08:
  text: Chapter 8 of the Bhagavad Gītā, Akṣara-brahma-yoga. Arjuna asks what Brahman, adhyātma, karma,
    adhibhūta and adhidaiva are. Kṛṣṇa explains them and teaches that whatever one remembers at the moment
    of death, to that one goes — so remember Him at all times and fight. He describes the cycles of the
    days and nights of Brahmā, and the two paths by which souls depart.
gita/gita/chapter-09:
  text: 'Chapter 9 of the Bhagavad Gītā, Rāja-vidyā-rāja-guhya-yoga. The whole universe is pervaded by
    Kṛṣṇa''s unmanifest form, yet He stands apart. Whatever is offered with love — a leaf, a flower, a
    fruit, water (patraṁ puṣpaṁ phalaṁ toyam) — He accepts; whoever worships Him with undivided devotion,
    He carries their burden. Even the gravest sinner who turns to Him is soon righteous: ''My devotee
    never perishes.'''
gita/gita/chapter-10:
  text: Chapter 10 of the Bhagavad Gītā, Vibhūti-yoga. Kṛṣṇa declares Himself the source of all, and Arjuna
    praises Him as the Supreme Brahman and asks to hear His glories. Kṛṣṇa lists His chief manifestations
    — among the Ādityas Viṣṇu, among lights the sun, among rivers the Gaṅgā, among the Pāṇḍavas Arjuna
    — and concludes that whatever is glorious, beautiful or mighty springs from a spark of His splendour.
gita/gita/chapter-11:
  text: 'Chapter 11 of the Bhagavad Gītā, Viśvarūpa-darśana-yoga. Granted divine sight, Arjuna beholds
    Kṛṣṇa''s universal form — countless faces, eyes and arms, the radiance of a thousand suns — and sees
    the warriors of both armies rushing into His mouths. ''I am Time, the destroyer of worlds'': Arjuna
    is to be merely the instrument. Terrified and awed, Arjuna praises Him and begs to see again the gentle
    four-armed and human form. Much of this chapter is in the Triṣṭubh metre.'
gita/gita/chapter-12:
  text: Chapter 12 of the Bhagavad Gītā, Bhakti-yoga. Arjuna asks who is better — those who worship the
    personal Lord or the unmanifest Imperishable. Kṛṣṇa answers that both reach Him, but the path of the
    unmanifest is harder for the embodied; He gives a ladder of practice for those who cannot fix their
    mind on Him at once, and closes with the beloved qualities of His devotee — without hatred, friendly
    and compassionate, the same in honour and dishonour.
gita/gita/chapter-13:
  text: 'Chapter 13 of the Bhagavad Gītā, Kṣetra-kṣetrajña-vibhāga-yoga. The body is the field, and He
    who knows it is the knower of the field — and Kṛṣṇa is the knower in all fields. He lists the virtues
    that constitute knowledge, describes the Brahman that is to be known, and explains prakṛti and puruṣa:
    whoever sees the Lord dwelling equally in all beings, imperishable among the perishing, truly sees.'
gita/gita/chapter-14:
  text: 'Chapter 14 of the Bhagavad Gītā, Guṇa-traya-vibhāga-yoga. Kṛṣṇa explains how the three qualities
    of nature — sattva, rajas and tamas — bind the embodied soul: sattva by attachment to happiness and
    knowledge, rajas by attachment to action, tamas by delusion and sloth. Asked about the one who has
    transcended them, He describes the guṇātīta — equal in pleasure and pain, praise and blame — who serves
    Him with unwavering devotion.'
gita/gita/chapter-15:
  text: Chapter 15 of the Bhagavad Gītā, Puruṣottama-yoga. The world is an eternal aśvattha tree with
    roots above and branches below, to be cut down with the axe of detachment. Kṛṣṇa is the light of the
    sun and moon, the digestive fire in all beings, seated in every heart; beyond the perishable and the
    imperishable, He is the Supreme Person, the Puruṣottama. This short chapter is traditionally recited
    before meals.
gita/gita/chapter-16:
  text: Chapter 16 of the Bhagavad Gītā, Daivāsura-sampad-vibhāga-yoga. Kṛṣṇa lists the divine qualities
    that lead to liberation — fearlessness, purity, charity, self-control, non-violence, truthfulness,
    compassion — and the demoniac ones that lead to bondage — hypocrisy, arrogance, anger and harshness.
    Lust, anger and greed are the three gates of hell; so let the scripture be your authority in deciding
    what to do.
gita/gita/chapter-17:
  text: 'Chapter 17 of the Bhagavad Gītā, Śraddhā-traya-vibhāga-yoga. Faith takes the form of one''s nature:
    sāttvika, rājasa or tāmasa. Kṛṣṇa describes the three kinds of food, sacrifice, austerity (of body,
    speech and mind) and charity, and ends with the meaning of ''Om Tat Sat'', the threefold designation
    of Brahman.'
gita/gita/chapter-18:
  text: 'Chapter 18 of the Bhagavad Gītā, Mokṣa-sannyāsa-yoga. Kṛṣṇa distinguishes renunciation (sannyāsa)
    from relinquishment (tyāga), analyses knowledge, action, doer, intellect, resolve and happiness by
    the three guṇas, and teaches that one attains perfection by worshipping Him through one''s own duty.
    Then the final word: ''Abandon all dharmas and take refuge in Me alone; I will free you from all sins
    — do not grieve.'' Arjuna''s delusion is gone, and Sañjaya closes: where Kṛṣṇa and Arjuna are, there
    are fortune, victory and justice.'
gita/gsa:
  text: 'The Gītārtha-saṅgraha of Śrī Yāmunācārya (Āḷavandār), the great Śrīvaiṣṇava teacher: 32 verses
    summarising the meaning of the Bhagavad Gītā. It describes the Gītā''s aim as Nārāyaṇa, attainable
    only through devotion arising from one''s duty, knowledge and detachment; treats the three hexads
    of chapters (karma and jñāna yoga, bhakti yoga, and their synthesis); and gives the purport of each
    of the eighteen chapters in turn, ending with the four kinds of devotees and the glory of the jñānī.'
gita/mahatmyam:
  text: 'Seven verses on the greatness of the Gītā, traditionally chanted after the text: whoever reads
    this holy scripture with care attains the abode of Viṣṇu; a single bath in the waters of the Gītā
    washes away the dirt of saṁsāra; all the Upaniṣads are cows, the son of Nanda the milker, Arjuna the
    calf, and the Gītā the nectar-milk; one scripture, the song of Devakī''s son; one God, Devakī''s son;
    one mantra, His names; one duty, His service.'
gita/mahatmyam-varaha-puranam:
  text: 'The Gītā-māhātmyam of the Varāha Purāṇa. After verses of meditation on Varāha, the boar incarnation
    who raised the earth on his tusk, the goddess Earth (Dharā) asks Lord Viṣṇu how unwavering devotion
    can arise in one still bound by prārabdha karma. Viṣṇu answers with the glories of the Gītā: its student
    is liberated and happy, untouched by sin like a lotus leaf by water; wherever the Gītā is read, all
    holy places are present; ''the Gītā is My supreme abode; relying on its knowledge I sustain the three
    worlds''; and He describes the merit of reciting the whole, half, a chapter, or even a single verse.'
stotra/ganesha/gakaradi-ganapati-sahasranama-stotram:
  text: The Gakārādi Gaṇapati Sahasranāma — a thousand names of Gaṇapati, every one beginning with the
    syllable 'ga', taught by Śiva. From the Rudrayāmala, in the Anuṣṭubh metre.
stotra/ganesha/ganapati-stava:
  text: The Gaṇapati Stava, attributed to the sage Garga, in the Bhujaṅgaprayāta metre, praises Gaṇapati
    as the formless, changeless Supreme.
stotra/ganesha/ganashtakam:
  text: The Gaṇāṣṭakam — eight verses on Gaṇeśa, in the Anuṣṭubh metre.
stotra/ganesha/maha-ganesha-pancharatnam:
  text: The Mahāgaṇeśa Pañcaratnam — five jewel-like verses on Gaṇeśa, composed by Ādi Śaṅkarācārya in
    the Pañcacāmara metre, beginning 'mudākarātta-modakam'.
stotra/ganesha/mahaganapati-navarnavedapada-stava:
  text: The Mahāgaṇapati Navārṇa-vedapāda Stava — a hymn to Mahāgaṇapati, in the Anuṣṭubh metre.
stotra/ganesha/vakratunda-mahaganapati-sahasranama-stotram:
  text: The Vakratuṇḍa Mahāgaṇapati Sahasranāma — a thousand names of Gaṇeśa, from the Gaṇeśa Purāṇa.
stotra/guru/jagadguru-ratna-mala:
  text: 'The Jagadguru Ratnamālā of Śrī Sadāśiva Brahmendra, the avadhūta saint of Nerūr, is a garland of
    verses on the Guru-paramparā of the Śrī Kāñcī Kāmakoṭi Pīṭha. After salutations to the Supreme Brahman,
    Śrī Dakṣiṇāmūrti, Viṣṇu, Brahmā and Vasiṣṭha, it follows the line through Śuka and Govinda Bhagavatpāda
    to Śrī Ādi Śaṅkara Bhagavatpāda, and then each Jagadguru who succeeded him at Kāñcīpuram, ending with
    Śrī Paramaśivendra Sarasvatī, the author''s guru. The closing verse says that Sadāśiva Brahmendra composed
    it at the bidding of Śrī Ātmabodhendra Sarasvatī: eighty-six verses in the Vasantamālikā metre. Ātmabodhendra
    later wrote the commentary Suṣamā on it. With the Puṇyaśloka-mañjarī, it is one of the traditional pramāṇa
    texts on the lineage.'
stotra/guru/kanchi-kamakoti-guru-parampara-stava:
  text: Śrī Kāñcī Kāmakoṭi Pīṭha, the Sarvajña Pīṭha at Kāñcīpuram, was established by Śrī Ādi Śaṅkara
    Bhagavatpāda (Kalyabda 2621, 482 BCE), and its unbroken line of Jagadgurus continues to this day under
    the 70th Pīṭhādhipati, Śrī Śaṅkara Vijayendra Sarasvatī Śaṅkarācārya Svāmigal, and His śiṣya, the
    71st Jagadguru, Śrī Satya Candraśekharendra Sarasvatī Svāmigal. In this stava the 65th Jagadguru,
    Śrī Sudarśana Mahādevendra Sarasvatī Śrīcaraṇa, bows to that Guru-paramparā in simple Anuṣṭubh verses,
    recording some details not found in the earlier texts; the appendix verses (one of them by the 69th
    Jagadguru, Śrī Jayendra Sarasvatī Śrīpāda) salute the Jagadgurus who followed. It is one of the four
    traditional pramāṇa texts on the lineage, with the Puṇyaśloka-mañjarī (Śrī Sadāśiva Bodhendra Sarasvatī,
    the 56th Jagadguru), the Jagadguru-ratnamālā (Śrī Sadāśiva Brahmendra) and its commentary Suṣamā (Śrī
    Ātmabodhendra Sarasvatī).
stotra/guru/vyasashtakam:
  text: The Vyāsāṣṭakam — eight verses in praise of Veda Vyāsa, in the Anuṣṭubh metre.
stotra/hanuman/apaduddharaka-dwadashamukha-hanuman-stotram:
  text: The Āpaduddhāraka Dvādaśamukha Hanumān Stotram — a hymn to twelve-faced Hanumān, the remover of
    distress, spoken by Vibhīṣaṇa. From the Sudarśana Saṁhitā.
stotra/hanuman/hanumat-pancharatnam:
  text: The Hanumat Pañcaratnam — five verses on Hanumān, composed by Ādi Śaṅkarācārya.
stotra/hanuman/sundara-hanuman-maha-mantra-nama-stotram:
  text: The Sundara-Hanumān Mahāmantra-nāma Stotram — names of Hanumān, in the Anuṣṭubh metre.
stotra/krishna/achyutashtakam:
  text: The Acyutāṣṭakam — eight verses on Śrī Kṛṣṇa, composed by Ādi Śaṅkarācārya in the Sragviṇī metre,
    beginning 'acyutaṁ keśavaṁ rāma-nārāyaṇam'.
stotra/krishna/akrurakrta-dashavatara-stuti:
  text: From the Śrīmad Bhāgavatam (Skandha 10, Adhyāya 40). Kaṃsa has sent Akrūra to Vraja to bring Kṛṣṇa
    and Balarāma to Mathurā. On the way back, Akrūra stops at the Yamunā for his midday bath, and under
    the water he sees the two boys; looking again, he sees Viṣṇu reclining on Ādiśeṣa, attended by sages
    and devas. Overwhelmed, he praises the Lord, and in these six verses he salutes Him in each of His
    avatāras, from Matsya to Kalki.
stotra/krishna/balamukundashtakam:
  text: The Bālamukundāṣṭakam — eight verses on the child Kṛṣṇa, beginning with the beloved image of the
    baby who places His lotus-foot in His lotus-mouth.
stotra/krishna/balaraksha:
  text: 'From the Śrīmad Bhāgavatam (Skandha 10, Adhyāya 6). The infant Kṛṣṇa has just slain the demoness
    Pūtanā, who came to Gokula to nurse Him with poisoned milk. Shaken, the gopīs guard the child as mothers
    do: they wave a cow''s tail over Him, bathe Him and mark His limbs, and place the Lord''s names on
    each part of His body (“May Aja protect your feet, Maṇimān your knees…”), praying that every harm
    flee at the sound of Viṣṇu''s names. Here those protective verses are preceded by a few dhyāna-ślokas.'
stotra/krishna/bhishma-stavaraja:
  text: The Bhīṣma Stavarāja — the 'king of hymns' sung by Bhīṣma to Śrī Kṛṣṇa from his bed of arrows.
    From the Mahābhārata.
stotra/krishna/bhishma-stuti:
  text: 'From the Śrīmad Bhāgavatam (Skandha 1, Adhyāya 9). The war is over. Bhīṣma lies on his bed of
    arrows at Kurukṣetra, waiting for the sun to turn north before he gives up his body. Yudhiṣṭhira comes
    with his brothers and Śrī Kṛṣṇa, and after Bhīṣma has taught him dharma, the moment arrives. Gazing
    at Kṛṣṇa standing before him, Bhīṣma offers this praise: he recalls the Lord as Arjuna''s charioteer,
    His face dusted by the battle, and the time He broke His own vow and rushed at Bhīṣma wheel in hand
    to keep His devotee''s word. Then, his mind fixed on Kṛṣṇa, he sheds his mortal coil.'
stotra/krishna/damodarashtakam:
  text: The Dāmodarāṣṭakam, from the Padma Purāṇa, in the Bhujaṅgaprayāta metre, celebrates the child
    Kṛṣṇa bound to the mortar by Yaśodā.
stotra/krishna/dhruvakrta-bhagavat-stavam:
  text: From the Śrīmad Bhāgavatam (Skandha 4, Adhyāya 9), in the Vasantatilakā metre. The five-year-old
    prince Dhruva, turned away from his father's lap by his stepmother Suruci, goes to the forest of Madhuvana
    and, on Nārada's instruction, worships Viṣṇu with severe penance. When the Lord appears before him
    on Garuḍa, the child stands with folded hands, unable to speak. Viṣṇu touches his cheek with His conch,
    and at once the words of this praise flow from him.
stotra/krishna/govindashtakam:
  text: The Govindāṣṭakam — eight verses on Śrī Kṛṣṇa as Govinda, composed by Ādi Śaṅkarācārya.
stotra/krishna/guruvatapurisha-pancharatnam:
  text: The Guruvātapurīśa Pañcaratnam — five verses on the Lord of Guruvāyūr, composed by Anantarāma
    Dīkṣita.
stotra/krishna/krishna-dwadasha-nama-stotram:
  text: The Kṛṣṇa Dvādaśa-nāma Stotram — twelve names of Śrī Kṛṣṇa, from the Mahābhārata, in the Anuṣṭubh
    metre.
stotra/krishna/krishna-jananam:
  text: 'From the Śrīmad Bhāgavatam (Skandha 10, Adhyāya 3). At midnight, in Kaṃsa''s prison at Mathurā,
    Kṛṣṇa is born to Devakī and Vasudeva, and all nature rejoices. Vasudeva beholds the wondrous child:
    lotus-eyed and four-armed, holding the conch, discus, mace and lotus, with the Śrīvatsa on His chest
    and the Kaustubha at His throat, shining in yellow silk, crown and earrings.'
stotra/krishna/krishna-nama-mahatmyam:
  text: 'From the Skanda Purāṇa (Vaiṣṇava-khaṇḍa), in the Mārgaśīrṣa-māhātmya, where the Lord teaches
    Brahmā the observances of Mārgaśīrṣa, the month He calls His own in the Gītā (“māsānāṃ mārgaśīrṣo''ham”).
    In this fifteenth chapter He tells His son a secret dearer to Him than the rest: of all His names,
    “Kṛṣṇa, Kṛṣṇa” pleases Him most. Whoever remembers Him by it, He lifts out of hell as a lotus rises
    through water; even said in jest, in pretence or at the hour of death, it keeps Yama far away. The
    name is the rain-cloud that quenches the fire of sin and the fire that burns the serpent of Kali;
    it is as holy as the Gaṅgā at Prayāga or the Sarasvatī at Kurukṣetra, and a home where it is sung
    each day is itself Gayā, Kāśī and Puṣkara. The chapter ends with a promise to whoever reads it at
    dawn, or at the three sandhyās.'
stotra/krishna/krishnashtakam1:
  text: A Kṛṣṇāṣṭakam — eight verses composed by Ādi Śaṅkarācārya in the Śikhariṇī metre.
stotra/krishna/krishnashtakam2:
  text: A Kṛṣṇāṣṭakam — eight verses on Śrī Kṛṣṇa, composed by Ādi Śaṅkarācārya.
stotra/krishna/krishnashtakam3:
  text: The popular Kṛṣṇāṣṭakam — 'vasudeva-sutaṁ devam' — eight verses ending 'kṛṣṇaṁ vande jagadgurum',
    in the Anuṣṭubh metre.
stotra/krishna/narayana-keshadipadanta-varnanam:
  text: 'The hundredth and last daśaka of the Nārāyaṇīyam, Melpattūr Nārāyaṇa Bhaṭṭatiri''s retelling
    of the Bhāgavatam in a little over a thousand verses (as its last verse says), composed before Guruvāyūrappan.
    Tradition holds that Bhaṭṭatiri took on his guru Acyuta Piṣāraṭi''s crippling rheumatism, and sought
    relief at Guruvāyūr by offering a daśaka of about ten verses each day, the Lord nodding His assent
    to each. On the hundredth day, with the story told, the Lord appears to him. “Agre paśyāmi tejaḥ”:
    he sees a light before him, and within it a youthful divine form, surrounded by Nārada and the sages
    and by the Upaniṣads as radiant maidens. He then describes the vision from the crown of the head to
    the feet (keśādi-pāda), and ends asking forgiveness for whatever he has said without knowing the Lord''s
    greatness. The closing words, “āyur-ārogya-saukhyam” (long life, health and happiness), are both the
    poem''s blessing to its readers and, read as a chronogram, the day of its completion; and by tradition,
    with the last verse his illness left him.'
stotra/krishna/santanagopala-stotram:
  text: The Santāna Gopāla Stotram, in the Anuṣṭubh metre, is a prayer to Śrī Kṛṣṇa as Gopāla for the
    blessing of children.
stotra/krishna/vatapuranatha-ashtakam:
  text: The Vātapuranāthāṣṭakam — eight verses on Śrī Kṛṣṇa, the Lord of Guruvāyūr.
stotra/lakshmi/kanakadhara-stavam:
  text: The Kanakadhārā Stavam — composed by Ādi Śaṅkarācārya in the Vasantatilakā metre, at whose recitation
    Goddess Lakṣmī is said to have showered golden fruits on a poor household.
stotra/lakshmi/lakshmi-stotram:
  text: Indra's praise of Goddess Lakṣmī, from the Viṣṇu Purāṇa, in the Anuṣṭubh metre.
stotra/lakshmi/mahalakshmi-stuti:
  text: Agastya's praise of Goddess Mahālakṣmī, largely in the Vasantatilakā metre.
stotra/lakshmi/mahalakshmyashtakam:
  text: The Mahālakṣmyaṣṭakam — eight verses on Goddess Mahālakṣmī, spoken by Indra, from the Padma Purāṇa,
    in the Anuṣṭubh metre.
stotra/nadi/ganga-stuti:
  text: 'From the Skanda Purāṇa (Kāśī-khaṇḍa), a stuti spoken by Brahmā, recited on Gaṅgā Daśaharā, the
    tenth day of the bright fortnight of Jyeṣṭha, when the Gaṅgā came down to earth. “Daśaharā” is “she
    who takes away ten”: bathing in the Gaṅgā and chanting this hymn before her on that day frees one
    from the ten kinds of sin, gathered over ten births, and lifts ten generations before and ten after
    from hell. The Varṣakṛtya-dīpikā lists the ten:


    - **Of the body (three):** taking what is not given; harming others in ways the scriptures do not
    sanction; coveting another''s wife.

    - **Of speech (four):** harsh words; untruth; tale-bearing and slander; idle, senseless talk.

    - **Of the mind (three):** coveting what belongs to others; wishing others ill; clinging to what is
    false.'
stotra/nadi/gangakarshanashtakam:
  text: 'The Gaṅgākarṣaṇāṣṭakam, “the eight verses that drew the Gaṅgā”, by Śrīdhara Veṅkaṭeśa Ayyāvāḷ
    of Tiruviśanallūr, the seventeenth-century saint of the nāma-siddhānta. On the day of his father''s
    śrāddha, Ayyāvāḷ saw a starving outcaste and gave him the food made ready for the rite. The brāhmaṇas
    called it a sin and would perform the śrāddha only if he first bathed in the Gaṅgā. Ayyāvāḷ, who could
    not go to Kāśī, turned instead to Śiva, the bearer of the Gaṅgā, with these verses: “I am no ascetic,
    no descendant of Sagara… Śambhu, open your matted locks.” The Gaṅgā welled up in the well of his house
    and flowed through the street, and the last verses record the wonder: “How does the flood surge here
    in this well? Surely the Lord is pleased with me… May this stream of compassion, risen from the well,
    purify the people here for ever.” Every year on the Kārttika amāvāsyā, devotees bathe in that well
    at Tiruviśanallūr.'
stotra/nadi/gangashtakam:
  text: The Gaṅgāṣṭakam — eight verses in praise of the holy river Gaṅgā.
stotra/nadi/kaveri-prarthana:
  text: A short prayer to the river Kāverī, in the Anuṣṭubh metre.
stotra/nadi/narmadashtakam:
  text: The Narmadāṣṭakam — composed by Ādi Śaṅkarācārya in the Pañcacāmara metre, with its flowing refrain
    'tvadīya pāda-paṅkajaṁ namāmi devi narmade'.
stotra/nadi/triveni-stotram:
  text: A hymn to the Triveṇī, the confluence of the Gaṅgā, Yamunā and Sarasvatī.
stotra/nadi/yamunashtakam:
  text: The Yamunāṣṭakam — eight verses in praise of the river Yamunā.
stotra/navagraha/aditya-hrdayam:
  text: The Āditya Hṛdayam — the hymn to the Sun that the sage Agastya taught Śrī Rāma on the battlefield
    before His final battle with Rāvaṇa. From the Śrīmad Rāmāyaṇa, in the Anuṣṭubh metre.
stotra/navagraha/angaraka-stotram:
  text: A hymn to Aṅgāraka (Mars), from the Skanda Purāṇa, in the Anuṣṭubh metre.
stotra/navagraha/brihaspati-stotram:
  text: A hymn to Bṛhaspati (Jupiter), from the Skanda Purāṇa, in the Anuṣṭubh metre.
stotra/navagraha/budha-panchavimshati-nama-stotram:
  text: Twenty-five names of Budha (Mercury), from the Padma Purāṇa, in the Anuṣṭubh metre.
stotra/navagraha/dwadasharya-surya-stuti:
  text: 'Twelve verses in the Āryā metre on Surya. It opens with a prayer that echoes the Ṛgveda: “May
    Sūrya, rising today and ascending the northern sky, swiftly dispel the disease of my heart and my
    pallor.” The second verse salutes the Lord of the lotuses, who crosses two thousand two hundred and
    two yojanas in half a twinkling of the eye; the third sees him as the twelve-fold one who moves through
    the world as the ten organs of action and knowledge, the mind and the jīva. He is the Yajus, the Ṛk
    and the Sāman, the Āgama and the sacred vaṣaṭ, the haṃsa and the paramahaṃsa; and from his several
    forms the devotee asks for knowledge, liberation, prosperity and health.'
stotra/navagraha/ketu-panchavimshati-nama-stotram:
  text: Twenty-five names of Ketu, from the Skanda Purāṇa, in the Anuṣṭubh metre.
stotra/navagraha/navagraha-mangalashtakam:
  text: The Navagraha Maṅgalāṣṭakam — eight auspicious verses on the nine planets, in the Śārdūlavikrīḍita
    metre.
stotra/navagraha/navagraha-pidahara-stotram:
  text: A hymn to the nine planets to relieve their afflictions, attributed to Veda Vyāsa, from the Brahmāṇḍa
    Purāṇa, in the Anuṣṭubh metre.
stotra/navagraha/navagraha-stotram:
  text: The popular Navagraha Stotram of Veda Vyāsa — one verse for each of the nine planets, beginning
    with Sūrya ('japā-kusuma-saṅkāśam'), in the Anuṣṭubh metre.
stotra/navagraha/rahu-panchavimshati-nama-stotram:
  text: Twenty-five names of Rāhu, from the Skanda Purāṇa, in the Anuṣṭubh metre.
stotra/navagraha/shanaishchara-ashtakam(-dasharatha):
  text: The Śanaiścara Aṣṭakam of King Daśaratha — his prayer to Śani.
stotra/navagraha/shukra-chaturvimshati-nama-stotram:
  text: Twenty-four names of Śukra (Venus), from the Skanda Purāṇa, in the Anuṣṭubh metre.
stotra/navagraha/surya-grahana-pidaparihara-shlokam:
  text: A verse recited to ward off the afflictions of a solar eclipse.
stotra/navagraha/surya-kavacham:
  text: The Sūrya Kavacam — a protective armour of verses addressed to the Sun, attributed to Yājñavalkya,
    in the Anuṣṭubh metre.
stotra/navagraha/surya-mandala-stotram:
  text: The Sūrya Maṇḍala Stotram, from the Bhaviṣya Purāṇa, in praise of the orb of the Sun.
stotra/navagraha/surya-pratah-smarana-stotram:
  text: A morning remembrance (prātaḥ-smaraṇa) of the Sun, in the Vasantatilakā metre.
stotra/navagraha/surya-sahasranama-stotram:
  text: 'A thousand names of the Sun, from the Bhaviṣya Purāṇa, given in answer to King Śatānīka, who
    asks to hear the names by which the Sun god himself once appeared before the teller; the teller has
    them from Vyāsa. Among the closing names is a beautiful line: *sandhyā-rāga-karaḥ siddhaḥ sandhyā-vandana-vanditaḥ*,
    “he who paints the twilight sky red, and who is worshipped in the Sandhyāvandana.” The Sun to whom
    we offer arghya at dawn and dusk is the deity of the rite itself. The phala-śruti promises freedom
    from fear and disease, a hundred years of life, and victory to one who recites it daily.'
stotra/navagraha/surya-stavaraja:
  text: Sāmba's hymn to the Sun — the 'king of hymns' to Sūrya, in the Anuṣṭubh metre.
stotra/navagraha/surya-stuti:
  text: A hymn to the Sun, in the Anuṣṭubh metre.
stotra/navagraha/suryarya-stotram:
  text: A hymn to Surya.
stotra/other/kartaviryarjuna-stotram:
  text: A hymn to King Kārtavīryārjuna of the thousand arms, recited to recover what is lost, in the Anuṣṭubh
    metre.
stotra/other/svadha-stotram:
  text: From the Devī Bhāgavatam (Skandha 9, Adhyāya 44), in the Anuṣṭubh metre, where Nārāyaṇa tells
    Nārada the story of Svadhā, the goddess through whom offerings reach the Pitṛs. When the ancestors
    went hungry because their offerings did not reach them, Brahmā meditated on the Devī and Svadhā appeared;
    this is the praise with which Brahmā honoured her. Whoever listens to it, the text says, gains the
    merit of bathing in every tīrtha.
stotra/other/yamabhayanivarana-stotram:
  text: A verse to dispel the fear of Yama.
stotra/other/yamashtakam:
  text: The Yamāṣṭakam — Sāvitrī's hymn to Yama, from the Brahmavaivarta Purāṇa, in the Anuṣṭubh metre.
stotra/rama/ahalyakrta-rama-stotram:
  text: 'From the Adhyātma Rāmāyaṇa (Bāla Kāṇḍa). Viśvāmitra is leading Rāma and Lakṣmaṇa to Mithilā when
    they come upon the silent, deserted āśrama of the sage Gautama. Viśvāmitra tells its story: Indra,
    in Gautama''s form, had come to Ahalyā, and the sage cursed his wife to remain there unseen, enduring
    sun and rain, until Rāma should come. At the touch of Rāma''s feet Ahalyā rises, freed, and sees before
    her the Lord whose feet Brahmā and Śaṅkara long to touch: “I am blessed, O refuge of the worlds, for
    I touch what they seek.” She marvels that He who has no feet ever moves, and asks for one boon only:
    that wherever she may be, her devotion stay fixed at His lotus feet. Then, having circled Him and
    bowed, she goes with His leave to her husband.


    The phala-śruti promises that whoever reads this hymn of Ahalyā with devotion is freed of all sins
    and reaches the supreme Brahman; that one who chants it for a child, holding Rāma in the heart, is
    blessed within a year with a good son, even if childless; that all desires are fulfilled by Rāmacandra''s
    grace; and that even one stained by the gravest sins is purified by chanting it daily, remembering
    Raghupati with devotion.'
stotra/rama/gayatri-ramayanam:
  text: The Gāyatrī Rāmāyaṇam — twenty-four verses of Vālmīki's Rāmāyaṇa, one for each syllable of the
    Gāyatrī mantra, in the Anuṣṭubh metre.
stotra/rama/munikrta-rama-stotram:
  text: The praise of Śrī Rāma by the sages, from the Skanda Purāṇa, in the Anuṣṭubh metre.
stotra/rama/rama-bhujangaprayata-stotram:
  text: A hymn to Śrī Rāma composed by Ādi Śaṅkarācārya in the Bhujaṅgaprayāta metre, beginning with Rāma
    as the pure, supreme Sat-cit-ānanda.
stotra/rama/rama-dwadasha-nama-stotram:
  text: Twelve names of Śrī Rāma, taught by Śiva, from the Skanda Purāṇa, in the Anuṣṭubh metre.
stotra/rama/rama-stava:
  text: Śiva's praise of Śrī Rāma.
stotra/rama/rama-stavaraja-stotram:
  text: The Rāma Stavarāja — the 'king of hymns' to Śrī Rāma, taught by Nārada, in the Anuṣṭubh metre.
stotra/rama/ramaraksha-stotram:
  text: The Rāmarakṣā Stotram of Budha Kauśika — a protective hymn to Śrī Rāma, beloved for its many-coloured
    names of Rāma.
stotra/rama/ramashtakam:
  text: The Rāmāṣṭakam, attributed to Veda Vyāsa, in the Pramāṇikā metre, beginning 'bhaje viśeṣa-sundaram'.
stotra/rama/sankshepa-ramayanam:
  text: The Saṅkṣepa Rāmāyaṇam — the whole story of Śrī Rāma in brief, as Nārada told it to Vālmīki at
    the beginning of the Rāmāyaṇa.
stotra/rama/sita-rama-stotram:
  text: The Sītā-Rāma Stotram, attributed to Hanumān, in the Anuṣṭubh metre — every verse praises Rāma
    and Sītā together.
stotra/rama/vivaha-mangalashtakam:
  text: The Vivāha Maṅgalāṣṭakam — eight auspicious verses recited at weddings.
stotra/saraswati/saraswati-sahasranama-stotram:
  text: The Sarasvatī Sahasranāma — a thousand names of Goddess Sarasvatī, taught by Sanatkumāra. From
    the Skanda Purāṇa, in the Anuṣṭubh metre.
stotra/saraswati/saraswati-stotram(-agastya):
  text: Agastya's hymn to Goddess Sarasvatī, beginning with the well-known 'yā kundendu-tuṣāra-hāra-dhavalā',
    in the Anuṣṭubh metre.
stotra/saraswati/saraswati-stotram(-brahma):
  text: Brahmā's hymn to Goddess Sarasvatī, in the Sragdharā metre.
stotra/saraswati/saraswati-stotram(-brihaspati):
  text: Bṛhaspati's hymn to Goddess Sarasvatī, in the Anuṣṭubh metre.
stotra/saraswati/sharada-bhujangaprayata-ashtakam:
  text: The Śāradā Bhujaṅgaprayātāṣṭakam — eight verses on Goddess Śāradā, composed by Ādi Śaṅkarācārya
    in the Bhujaṅgaprayāta metre.
stotra/saraswati/sharada-prarthana:
  text: A prayer to Goddess Śāradā, who dwells in Kāśmīra, attributed to Ādi Śaṅkarācārya, in the Anuṣṭubh
    metre.
stotra/saraswati/vani-stavanam:
  text: A hymn in praise of Vāṇī (Sarasvatī), in the Anuṣṭubh metre.
stotra/shakti/annapurna-stotram:
  text: The Annapūrṇā Stotram — composed by Ādi Śaṅkarācārya in the Śārdūlavikrīḍita metre, with the refrain
    'bhikṣāṁ dehi kṛpāvalambana-karī mātā'nnapūrṇeśvarī'.
stotra/shakti/arjuna-krta-durga-stuti:
  text: 'From the Mahābhārata, Bhīṣma Parva (Gītā Parva, Adhyāya 23), just before the Gītā itself. Sañjaya
    tells Dhṛtarāṣṭra how, with the armies drawn up at Kurukṣetra, Śrī Kṛṣṇa said to Arjuna: “Purify yourself
    and recite the Durgā stotra for the defeat of your enemies.” Arjuna steps down from his chariot and
    prays with folded hands to Durgā: leader of the Siddhas'' host, dweller on Mandara, Kumārī, Kālī,
    Bhadrakālī, Kātyāyanī, Vijayā and Jayā.


    The Devī, moved by his devotion, speaks from the sky in front of Govinda: “You will soon conquer your
    enemies, Pāṇḍava. You are Nara, with Nārāyaṇa as your ally, unconquerable even by Indra.” Arjuna takes
    it as his victory and mounts the chariot, and Kṛṣṇa and Arjuna blow their divine conches.


    Whoever recites the hymn on rising at dawn has no fear of yakṣas, rākṣasas, piśācas, enemies, serpents
    or the king''s court. They win disputes, are freed from bonds, cross every difficulty, escape thieves,
    are always victorious in battle and gain Lakṣmī. They live a hundred years in health and strength.
    The chapter closes with the famous words *yato dharmas tataḥ kṛṣṇo yataḥ kṛṣṇas tato jayaḥ*: “where
    there is dharma there is Kṛṣṇa, and where Kṛṣṇa is, there is victory.”'
stotra/shakti/durga-chandra-kala-stuti:
  text: The Durgā Candrakalā Stuti — a hymn to Goddess Durgā, in the Vasantatilakā metre, by Appayya Dīkṣita.
stotra/shakti/durga-pancharatnam:
  text: 'Five verses to Durgā composed by the Paramācārya of Kāñcī, Śrī Candraśekharendra Sarasvatī. Every
    verse ends with the same prayer, *māṃ pāhi sarveśvari mokṣadātri*: “protect me, Queen of all, Giver
    of liberation.” The hymn is woven from the Upaniṣads, above all the Śvetāśvatara:


    - **Verse 1** opens with Śvetāśvatara 1.3, where the seers, absorbed in meditation, *saw the Devī,
    the power of the Lord, hidden by Her own guṇas*.

    - **Verse 3** takes up Śvetāśvatara 6.8: *Her supreme power is heard of as manifold, and Her knowledge,
    strength and action are natural to Her*.

    - **Verse 4** reads *devātma* (“the self of the Lord”) as Śiva''s own self, following the Kūrma and
    Vāyu Purāṇas, and hails Her as the One who cuts the bonds of the soul.

    - **Verse 5** draws on the Taittirīya Upaniṣad, where Brahman is the “tail” and support of the bird-like
    self, and calls Her *upadiṣṭa-gītā*, the One who taught the Gītā.


    The hymn came forth one afternoon at Tēnambākkam, near Kāñcī, where the Ācārya was staying. Seated
    by a pond, he called a young scholar for paper and pen and began uttering Sanskrit words one by one,
    sometimes giving the meaning and asking the scholar to find the word, until the lines formed this
    stuti. The scribe is remembered as Mullaivāsal Kṛṣṇamūrti Śāstrigaḷ, who would recount the day whenever
    he spoke of the Ācārya.


    At *upadiṣṭa-gītā* the scholar hesitated: could one say that the Devī taught the Gītā? The Ācārya
    had the Gītā-bhāṣya brought and showed him Kṛṣṇa''s words *brahmaṇo hi pratiṣṭhāham*, “I am the abode
    of Brahman” (Gītā 14.27). Śaṅkara explains the “I” there as the Lord''s power, and since power and
    its possessor are not different (*śakti-śaktimatoḥ abhedaḥ*), the Gītā taught by Kṛṣṇa is equally
    Her teaching. The hymn later became widely known through M. S. Subbulakshmi''s rendering.'
stotra/shakti/durga-stotram:
  text: 'From the Brahmavaivarta Purāṇa (Prakṛti Khaṇḍa, Adhyāya 66), as Nārāyaṇa tells it to Nārada.
    Śrī Kṛṣṇa Himself praises Durgā as the Mūla-prakṛti, the Mother of all. For the sake of creation She
    is saguṇa, yet in truth She is nirguṇa, Parabrahma-svarūpā Herself. She is Svāhā at the offerings
    to the gods and Svadhā at the offerings to the ancestors. She is learning in the learned, insight
    in the wise, majesty in kings and trade in merchants. She protects the good like a mother, and She
    is the great Māyā by which even the wise fail to see the path to liberation.


    The phala-śruti says that one who reads it at the time of pūjā gains what they wish. A childless woman
    who hears it for a year is blessed with a good son. A prisoner is freed within a month, and the gravely
    ill are cured within a year. Those separated from son, family or wife are reunited, and hearing it
    gives protection at the king''s gate, in the cremation ground, the forest, the battlefield, near wild
    beasts and in fire. A poor and unlettered person who reads it for a year becomes learned and wealthy.'
stotra/shakti/gauri-dashakam:
  text: The Gaurī Daśakam — ten verses in praise of Goddess Gaurī.
stotra/shakti/gayatri-stotram:
  text: A hymn to Goddess Gāyatrī, beginning with her meditative form of five faces, in the Anuṣṭubh metre.
stotra/shakti/kalyana-vrishti-stotram:
  text: The Kalyāṇavṛṣṭi Stotram — verses to Goddess Lalitā that 'shower auspiciousness', composed by
    Ādi Śaṅkarācārya.
stotra/shakti/kamakshi-mahatmyam:
  text: 'Twelve verses on the glory of Kāmākṣī and Her shrine, from the twenty-third chapter of the Kāmākṣī
    Vilāsa.


    They begin by marking out Tuṇḍīra-maṇḍala, the land around Kāñcī, bounded by the Svāmi-puṣkariṇī tīrtha,
    the eastern sea, the Pinākinī river and Śilāhrada. At its centre, between the Kampā and Vegavatī rivers,
    lies the Kāma-koṣṭha, where Kāmākṣī dwells. Her image there is the Devī''s root form (*mūla-vigraha*):
    in Kāñcī there is no other image of the Devī. Her seat is the navel of the earth, shaped as the *kāma-kalā*
    of the world, and it is called Kāmakoṭi because whatever good is done there bears fruit a crore-fold.


    The verses then tell what the shrine gives:


    - Japa of one''s mantra in the Kāma-koṣṭha brings the fruit of a crore of repetitions, and leads to
    the world of liberation.

    - Staying there for even half a moment frees one from all sins.

    - Circling the Kāma-koṣṭha and the *bilābhra* of Śambhu below the Gāyatrī-maṇḍapa brings, step by
    step, the merit of gifting a cow about to calve.

    - Worshipping Kāmākṣī on Her birth-day through the great inner path gives the fruit of a crore of
    pūjās, and even one act of service to Her leads to kaivalya.


    The closing verse promises that one who reads these twelve verses on rising, at the time of the morning
    bath, gains every fruit they describe.'
stotra/shakti/kamakshi-stotram:
  text: A hymn to Goddess Kāmākṣī of Kāñcī, in the Śārdūlavikrīḍita metre.
stotra/shakti/kamakshi-suprabhatam:
  text: The Kāmākṣī Suprabhātam — morning verses awakening Goddess Kāmākṣī, composed by Lakṣmīkānta Śarmā.
stotra/shakti/lalita-pancharatnam:
  text: The Lalitā Pañcaratnam — five morning verses on Goddess Lalitā, composed by Ādi Śaṅkarācārya in
    the Vasantatilakā metre.
stotra/shakti/lalita-trishati:
  text: The Lalitā Triśatī — three hundred names of Śrī Lalitā, in the Anuṣṭubh metre.
stotra/shakti/minakshi-pancharatnam:
  text: The Mīnākṣī Pañcaratnam — five verses on Goddess Mīnākṣī of Madurai, composed by Ādi Śaṅkarācārya
    in the Śārdūlavikrīḍita metre.
stotra/shakti/muka-sarah:
  text: 'The Mūkasāra, “the essence of Mūka”, is a garland of verses from the Mūka Pañcaśatī, the five
    hundred verses on Kāmākṣī of Kāñcī by the poet Mūka. The selection was made by the Paramācārya of
    Kāñcī, Śrī Candraśekharendra Sarasvatī, and a few more popular verses are added here (shown in brackets:
    Āryā Śataka 1 and 100, and Stuti Śataka 6).


    Its forty verses are ordered by the five śatakas they come from, and each verse is marked with its
    śataka and number:


    - **Āryā Śataka** (8 verses), in the short āryā metre: Her form as Compassion itself, playing in Kāñcī''s
    Kāma-pīṭha, and the closing *jaya jaya jagadamba śive*.

    - **Pādāravinda Śataka** (8): Her lotus feet, a boat on the ocean of saṃsāra and the giver of fame,
    wealth and poetry.

    - **Stuti Śataka** (10): praise of the Devī and of Kāñcī.

    - **Kaṭākṣa Śataka** (8): the grace of Her sidelong glance.

    - **Mandasmita Śataka** (6): Her gentle smile. The last verse joins the five themes: one who meditates
    on the āryā, beholds Her feet, begins Her praise and receives Her glance rises on the waves of Her
    smile to the mansion of liberation.'
stotra/shakti/parashurama-krta-durga-stotram:
  text: 'From the Brahmavaivarta Purāṇa (Gaṇapati Khaṇḍa, Adhyāya 45), as Nārāyaṇa tells it to Nārada.
    Paraśurāma, a disciple of Śiva, praises Durgā as the wife of his guru. It is the episode in which,
    at the gates of Kailāsa, he struck Gaṇeśa with his axe and broke a tusk, making Him Ekadanta, and
    so angered Pārvatī.


    His praise begins in Goloka, at the dawn of creation, where the supreme Devī emerges from the body
    of the all-complete Śrī Kṛṣṇa. As Rādhā, the Mūla-prakṛti, She becomes the source of the cosmic Virāṭ,
    and then takes five forms: Rādhā, Sāvitrī, Lakṣmī, Sarasvatī and Durgā. Every goddess and every wife
    of a god or sage is a portion of Her portion, and so is the light in the sun, the heat in fire, the
    coolness of water and the fragrance of earth. Brahmā, Viṣṇu and Śiva themselves praised Her in their
    need, against Madhu and Kaiṭabha and in the war with Tripura. He ends like a child before his mother:
    *what mother is angered by the faults of her children?*


    Paraśurāma bows and weeps, and Durgā, pleased, blesses him: be immortal, victorious everywhere, devoted
    to Kṛṣṇa and to Śiva your guru. No one can harm one whose devotion to his chosen deity and guru is
    constant.


    The phala-śruti calls it a *stotra-rāja* of the Kāṇva śākhā. Read at the time of pūjā, at the start
    of a journey or in the morning, it grants one''s wish: a son, a daughter, learning or children; a
    lost kingdom or lost wealth regained; the anger of guru, god, king or kin turned to favour; release
    from robbers, serpents, enemies, illness, prison and the deep waters. Above all it is for women longing
    for children: listening to it for a year, after worshipping Durgā, brings a long-lived, wise son,
    and listening for six months brings good fortune.'
stotra/shakti/shashthi-devi-stotram:
  text: 'From the Brahmavaivarta Purāṇa (Prakṛti Khaṇḍa), in the story of Ṣaṣṭhī as Nārāyaṇa tells it
    to Nārada. Ṣaṣṭhī Devī is the presiding goddess of children (*bālādhiṣṭhātṛ-devī*), the sixth portion
    of the Śakti, and Devasenā, the beloved of Skanda. King Priyavrata, son of Svāyambhuva Manu, praises
    Her: Giver of boons, sons and wealth, ever present to Her devotees, free of violence and anger. He
    asks: “Give wealth, give a beloved wife, give a son; give dharma, fame, land, children, learning,
    welfare and victory.” Having praised Her, he receives a glorious son, a king among kings, by Her grace.


    The phala-śruti:


    - One without a son who listens to the hymn for a year gains a fine, long-lived son.

    - A woman who listens with devotion and restraint for a year is freed of all sins and gives birth,
    even if long barren, to a son who is brave, virtuous, learned, famous and long-lived.

    - A woman who bore only one child (*kāka-vandhyā*) or whose children did not survive is blessed with
    a son after a year of listening.

    - When a child is ill and the father and mother listen to it, the child recovers within a month.'
stotra/shakti/shitalashtakam:
  text: The Śītalāṣṭakam — a hymn to Goddess Śītalā, from the Skanda Purāṇa, in the Anuṣṭubh metre.
stotra/shakti/tripurasundaryashtakam:
  text: The Tripurasundarī Aṣṭakam — eight verses on Goddess Tripurasundarī, in the Pṛthvī metre, beginning
    'kadamba-vana-cāriṇīm'.
stotra/shakti/yudhishthira-krta-durga-stotram:
  text: 'From the Mahābhārata, Virāṭa Parva (Pāṇḍava-praveśa Parva, Adhyāya 8). The Pāṇḍavas'' twelve
    years in the forest are over, and the thirteenth, to be lived unrecognised, is about to begin. As
    they set out for Virāṭa''s city, Yudhiṣṭhira prays in his mind to Durgā, Queen of the three worlds.


    He hails Her as the One born of Yaśodā in Nanda''s house, dear to Nārāyaṇa. Kaṃsa dashed Her against
    a rock, and She rose into the sky. She is the Sister of Vāsudeva, bearing sword and shield, dark like
    Kṛṣṇa, with a face like Saṅkarṣaṇa''s. She has dwelt forever on the Vindhya, slayer of Mahiṣa: *because
    You carry people across difficulty (durga), You are called Durgā*. Those lost in forests, sinking
    in the ocean or held by robbers have Her as their refuge. Fallen from his kingdom, the king takes
    refuge in Her: “Be my refuge, O Durgā, kind to Your devotees.”


    The Devī appears before him. She promises victory in battle, the kingdom won back with his brothers,
    and health and joy. The Kauravas and the people of the city will not recognise the Pāṇḍavas while
    they live in Virāṭa''s city. Whoever remembers Her as he did, in exile, in battle, in forest, sea
    or mountain, will find nothing out of reach, and whoever hears or reads this hymn with devotion will
    see all their work succeed. Then, having placed the Pāṇḍavas under Her protection, She vanishes.'
stotra/shatanama/aditya-ashtottara-shatanama-stotram:
  text: 108 names of Āditya (the Sun), from the Bhaviṣya Purāṇa, in the Anuṣṭubh metre.
stotra/shatanama/anjaneya-ashtottara-shatanama-stotram:
  text: 108 names of Āñjaneya (Hanumān), in the Anuṣṭubh metre.
stotra/shatanama/annapurna-ashtottara-shatanama-stotram:
  text: 108 names of Goddess Annapūrṇā, from the Śiva Rahasya, in the Anuṣṭubh metre.
stotra/shatanama/ardhanarishvara-ashtottara-shatanama-stotram:
  text: 108 names of Ardhanārīśvara — Śiva and Pārvatī as one — in the Anuṣṭubh metre.
stotra/shatanama/dhanvantari-ashtottara-shatanama-stotram:
  text: 108 names of Dhanvantari, the divine physician, in the Anuṣṭubh metre.
stotra/shatanama/durga-ashtottara-shatanama-stotram:
  text: 108 names of Goddess Durgā, in the Anuṣṭubh metre.
stotra/shatanama/ganapati-ashtottara-shatanama-stotram:
  text: 108 names of Gaṇapati, from the Gaṇeśa Purāṇa, in the Anuṣṭubh metre.
stotra/shatanama/ganapati-gakara-ashtottara-shatanama-stotram:
  text: 108 names of Gaṇapati, each beginning with the syllable 'ga', in the Anuṣṭubh metre.
stotra/shatanama/ganesha-ashtottara-shatanama-stotram:
  text: 108 names of Gaṇeśa, in the Anuṣṭubh metre.
stotra/shatanama/ganga-ashtottara-shatanama-stotram:
  text: 108 names of Goddess Gaṅgā, in the Anuṣṭubh metre.
stotra/shatanama/gauri-ashtottara-shatanama-stotram:
  text: 108 names of Goddess Gaurī, in the Anuṣṭubh metre.
stotra/shatanama/goda-ashtottara-shatanama-stotram:
  text: 108 names of Goda (Āṇḍāḷ), in the Anuṣṭubh metre.
stotra/shatanama/harihara-ashtottara-shatanama-stotram:
  text: 108 names of Harihara — Viṣṇu and Śiva as one — from the Skanda Purāṇa.
stotra/shatanama/hariharaputra-ashtottara-shatanama-stotram:
  text: 108 names of Hariharaputra (Śāstā), in the Anuṣṭubh metre.
stotra/shatanama/hayagriva-ashtottara-shatanama-stotram:
  text: 108 names of Hayagrīva, the Lord of learning, in the Anuṣṭubh metre.
stotra/shatanama/karttikeya-ashtottara-shatanama-stotram:
  text: 108 names of Kārttikeya, in the Anuṣṭubh metre.
stotra/shatanama/krishna-ashtottara-shatanama-stotram:
  text: 108 names of Śrī Kṛṣṇa, from the Brahmāṇḍa Purāṇa, in the Anuṣṭubh metre.
stotra/shatanama/lakshmi-ashtottara-shatanama-stotram:
  text: 'The 108 names of Lakṣmī, opening with *prakṛtiṃ vikṛtiṃ vidyām*: She is both Nature and all its
    forms. She is Padmā, the lotus-dweller, born of the Ocean of Milk and sister of the moon, who dwells
    on Viṣṇu''s chest and destroys poverty.


    The phala-śruti calls it the *dāridrya-mocana*, the hymn that frees one from poverty:


    - One who chants it three times a day for six months with the senses controlled destroys poverty and
    gains everything without effort.

    - Among the Devī''s thousands of names these 108 are especially holy: by them even one poor for a
    crore of births gains prosperity.

    - Read a hundred times on Fridays for a year, it brings the eight kinds of wealth, like Kubera''s
    on earth.

    - Having enjoyed abundant blessings, one finally attains union with Her. Read every morning, meditating
    on Her adorned with every ornament, it quiets all sorrow.'
stotra/shatanama/lakshmi-narayana-ashtottara-shatanama-stotram:
  text: 'The 108 names of Lakṣmī and Nārāyaṇa, alternating beautifully between the two. Each name of Śrī
    is followed by one of Viṣṇu, so the Divine Couple are praised together, name by name: *śrīr viṣṇuḥ
    kamalā śārṅgī lakṣmīr vaikuṇṭha-nāyakaḥ*, “Śrī, Viṣṇu; Kamalā, the bearer of the Śārṅga bow; Lakṣmī,
    the Lord of Vaikuṇṭha.” Often a pair answers each other: Padmālayā and the four-armed One, Daughter
    of the Milk Ocean and Acyuta, Rukmiṇī and the slayer of Keśi, Jayapradā and Jayakara. The single closing
    verse promises that one who reads these 108 names on rising in the morning will always be victorious.'
stotra/shatanama/nrisimha-ashtottara-shatanama-stotram:
  text: 108 names of Nṛsiṁha, in the Anuṣṭubh metre.
stotra/shatanama/rama-ashtottara-shatanama-stotram:
  text: 108 names of Śrī Rāma, from the Padma Purāṇa, in the Anuṣṭubh metre, with a dhyāna verse in the
    Vasantatilakā metre.
stotra/shatanama/saraswati-ashtottara-shatanama-stotram:
  text: 108 names of Goddess Sarasvatī, in the Anuṣṭubh metre.
stotra/shatanama/shakti-ashtottara-shatadivyasthaniya-nama-stotram:
  text: 108 sacred places of the Goddess and her names there, from the Matsya Purāṇa, in the Anuṣṭubh
    metre.
stotra/shatanama/shankaracharya-ashtottara-shatanama-stotram:
  text: 108 names of Ādi Śaṅkarācārya, in the Anuṣṭubh metre.
stotra/shatanama/shiva-ashtottara-shatadivyasthaniya-nama-stotram:
  text: 108 sacred places of Śiva and his names there, from the Lalitāgama, in the Anuṣṭubh metre.
stotra/shatanama/shiva-ashtottara-shatanama-stotram:
  text: 108 names of Śiva, in the Anuṣṭubh metre.
stotra/shatanama/sita-ashtottara-shatanama-stotram:
  text: 108 names of Goddess Sītā, from the Ānanda Rāmāyaṇa, in the Anuṣṭubh metre.
stotra/shatanama/subrahmanya-ashtottara-shatanama-stotram:
  text: 108 names of Subrahmaṇya, in the Anuṣṭubh metre.
stotra/shatanama/surya-ashtottara-shatanama-stotram:
  text: From the Vana Parva of the Mahābhārata. The Pāṇḍavas are in exile in the forest, and the many
    brāhmaṇas who have followed them must be fed, but Yudhiṣṭhira has nothing to give. The family priest,
    the sage Dhaumya, teaches him these 108 names of Sūrya. Yudhiṣṭhira worships the Sun with them, the
    Sun appears before him, and gives him the Akṣaya-pātra, the vessel that never runs out until Draupadī
    has eaten for the day.
stotra/shatanama/tulasi-ashtottara-shatanama-stotram:
  text: 108 names of Tulasī, in the Anuṣṭubh metre.
stotra/shatanama/venkatesha-ashtottara-shatanama-stotram:
  text: 'The 108 names of Lord Veṅkaṭeśa, especially dear on the Saturdays of Purattāsi, hold a secret:
    take the first syllable of each name, in order, and together they spell a mantra, “oṃ namo veṅkaṭeśāya
    … śrīṃ klīṃ sauṃ … namo nārāyaṇa te svāhā”. The bīja syllables śrīṃ, klīṃ and sauṃ stand as names
    in the stotra itself.'
stotra/shatanama/vishnu-ashtottara-shatadivyasthaniya-nama-stotram:
  text: 108 sacred places of Viṣṇu and his names there, in the Anuṣṭubh metre.
stotra/shatanama/vyasa-ashtottara-shatanama-stotram:
  text: 108 names of Veda Vyāsa, in the Anuṣṭubh metre.
stotra/shiva/bilvashtakam:
  text: The Bilvāṣṭakam — eight verses on offering the three-leaved bilva to Śiva, in the Anuṣṭubh metre.
stotra/shiva/charanashringarahita-nataraja-stotram:
  text: 'The Caraṇa-śṛṅga-rahita Naṭarāja Stotram: ten verses to the dancing Śiva of Chidambaram, attributed
    to the sage Patañjali, traditionally the divine serpent Ādiśeṣa. The closing verse calls it the work
    of "the best of serpents" (*bhujaga-puṅgava*) and describes it as "without foot or horn" (*caraṇa-śṛṅga-rahitam*).


    True to its name, the hymn has no long vowel at all: no ā, ī, ū, e, ai, o or au, the signs that in
    Devanāgarī carry a "foot" or a "horn". Heavy syllables are made with anusvāra and conjuncts instead,
    which gives the verses their jingling, rolling gait: *sadañcita-mudañcita-nikuñcita-padaṃ…*


    Why "without feet and horns"? The traditional account is that Nandi, Śiva''s bull, who has both feet
    and horns, would not let Patañjali, who has neither, in to see the Lord. Patañjali answered by singing
    a hymn with neither. Some tellings give the role to Vyāghrapāda, the tiger-footed sage. We have not
    found this story in an early text. The scholar-monk Swami Kāśikānanda Giri, in his Sanskrit commentary,
    reads the name another way: "without beginning or end", like Śiva himself, whose pillar of fire Brahmā
    and Viṣṇu could never measure.'
stotra/shiva/dakshinamurti-stotram:
  text: The Dakṣiṇāmūrti Stotram of Ādi Śaṅkarācārya.
stotra/shiva/dakshinamurti-stotram(-samara-pungava-dikshita-krtam):
  text: A Dakṣiṇāmūrti Stotram composed by Samara-puṅgava Dīkṣita.
stotra/shiva/dakshinamurti-stotram(-vrishabha-deva-krtam):
  text: A Dakṣiṇāmūrti Stotram composed by Vṛṣabhadeva.
stotra/shiva/dakshinamurtyashtakam:
  text: The Dakṣiṇāmūrti Aṣṭakam of Ādi Śaṅkarācārya, in the Śārdūlavikrīḍita metre — Advaita in eight
    verses, beginning 'viśvaṁ darpaṇa-dṛśyamāna-nagarī-tulyam'.
stotra/shiva/gurvashtakam:
  text: The Gurvaṣṭakam of Ādi Śaṅkarācārya, in the Bhujaṅgaprayāta metre — whatever else one has, of
    what use is it, if the mind is not fixed on the Guru's feet?
stotra/shiva/kalabhairavashtakam:
  text: The Kālabhairavāṣṭakam — eight verses on Kālabhairava, the Lord of Kāśī.
stotra/shiva/lingashtakam:
  text: The Liṅgāṣṭakam — eight verses on the Śiva-liṅga, beginning 'brahma-murāri-surārcita-liṅgam'.
stotra/shiva/margabandhu-stotram:
  text: The Mārgabandhu Stotram of Appayya Dīkṣita — a prayer to Śiva, the companion of travellers.
stotra/shiva/matribhuta-shatakam:
  text: 'A hundred-odd verses to Śiva as Mātṛbhūteśvara, “the Lord who became a mother”, composed by Śrīdhara
    Veṅkaṭeśa Ayyāvāḷ, the saint of Tiruviśainallūr whose Gaṅgākarṣaṇāṣṭakam is also on this site. Mātṛbhūteśvara,
    Tāyumānavar in Tamil, is the Śiva of the Rock Fort temple at Tiruchirāppaḷḷi. The temple''s story
    tells of a devout woman, Ratnāvatī, whose time to give birth came while her mother was cut off by
    the Kāverī in flood. Śiva came in her mother''s form and tended her through the birth, and when the
    real mother arrived, the Lord revealed Himself.


    Ayyāvāḷ stayed at Tiruchirāppaḷḷi and worshipped Mātṛbhūteśvara daily. The temple is also the setting
    of a well-known episode: to test his devotion, the king had the Lord''s festival image dressed as
    Kṛṣṇa and taken past his house, and Ayyāvāḷ burst into the twelve verses of the Kṛṣṇa-dvādaśa-mañjarī.


    Every verse of the śataka ends with the same cry, *śrī-mātṛbhūta śiva pālaya māṃ namaste*: “O Śiva
    who became a mother, protect me.” Ayyāvāḷ comes to Him as a helpless child to a mother. He pleads
    that he is “the son of Your servant” (v. 3), and that wife, sons and kin love only for a reason, while
    Śiva alone is mother and father, a treasure of grace without condition (v. 20). He asks that his feet
    go round His shrine, his hands worship Him, his words praise Him and his mind rest in Him (v. 17),
    that his throat choke and his eyes fill at the sound of His name (v. 21), and that he ask for nothing
    except to keep calling on Him like this (v. 100). The phala-śruti (v. 102) asks the Lord to grant
    those who read or hear it health, long life, pure devotion to Śiva, wealth, learning, children, fame
    and, in the end, liberation.'
stotra/shiva/rudra-stotram:
  text: 'From the Mahābhārata (Droṇa Parva, Pratijñā Parva, chapter 80). After Abhimanyu''s death Arjuna
    vows to slay Jayadratha before the next sunset or enter the fire. That night, in a vision, Śrī Kṛṣṇa
    takes him to Kailāsa to seek Śiva''s weapon, and together they praise Mahādeva with this hymn, calling
    him the blue-throated, the bearer of Pināka and the trident, the matted-haired lord with the bull
    on his banner, the golden-hued husband of Ambikā, the thousand-eyed. Sañjaya closes: “Having praised
    Mahādeva thus, Vāsudeva with Arjuna propitiated Bhava to obtain the weapon.”'
stotra/shiva/sadashivashtakam:
  text: The Sadāśivāṣṭakam, attributed to Patañjali, from the Hālāsya Māhātmya — on Śiva at Madurai.
stotra/shiva/shambhu-stuti:
  text: Śrī Rāma's praise of Śiva, from the Padma Purāṇa, in the Upajāti metre.
stotra/shiva/shiva-mahimna-stotram:
  text: 'The Śiva Mahimnaḥ Stotram, “the hymn on Śiva''s greatness”, is one of the most celebrated of
    all hymns to Śiva, in the flowing śikhariṇī metre. Its own closing verses tell who composed it, and
    why.


    Its author is Puṣpadanta (“flower-toothed”, also called Kusumadaśana in v. 37), king of the Gandharvas
    and a devoted servant of Śiva. The tradition tells that he was enchanted by the flowers in the garden
    of King Citraratha, a great devotee of Śiva, and took to stealing them, coming unseen through the
    air. To catch the thief, the king strewed the path with *nirmālya*, flowers already offered to Śiva.
    Unknowing, Puṣpadanta stepped on them. At this offence to Śiva he lost his divine powers and could
    no longer fly or stay invisible. Realising his fault, he composed this hymn, and Śiva, pleased, restored
    him. The hymn itself says that the Gandharva, fallen from his glory through the Lord''s anger, composed
    this most divine praise (v. 37).


    The hymn begins in humility. If even Brahmā''s words fall short of Śiva''s greatness, then anyone
    may praise Him as far as their understanding goes (v. 1), and the Veda itself can speak of Him only
    by saying what He is not (v. 2). Just as rivers by straight and winding paths all reach the ocean,
    people of different tastes on different paths all reach Him alone (v. 7). It recalls His great deeds:
    drinking the poison, burning Tripura with the earth as His chariot, and Viṣṇu offering his own eye
    to complete a thousand lotuses. Śiva is the meaning of Om and of the eight names Bhava, Śarva, Rudra,
    Paśupati, Ugra, Mahādeva, Bhīma and Īśāna. Even if Sarasvatī wrote forever, with a mountain of ink
    in the ocean as its pot, a branch of the wish-tree as pen and the earth as paper, she could not reach
    the end of His glories (v. 32).


    The phala-śruti promises that one who reads it daily with devotion becomes like Rudra in Śiva''s world,
    with wealth, long life, sons and fame here (v. 34). *There is no god above Maheśa, no hymn above the
    Mahimnaḥ* (v. 35), and initiation, gifts, austerity, pilgrimage and sacrifice are not worth a sixteenth
    of its recitation (v. 36).'
stotra/shiva/shiva-manasapuja:
  text: 'Ādi Śaṅkarācārya''s worship of Śiva performed entirely in the mind. Verse by verse it offers
    each of the upacāras in imagination: a jewelled seat, a bath in cool Himalayan water, divine garments,
    sandal paste, jasmine, campaka and bilva flowers, incense and lamp; then food in a golden vessel,
    tāmbūla, the parasol and the cāmara, the mirror, the music of the vīṇā, bherī and mṛdaṅga, song and
    dance, full prostration and praise. The fourth verse turns the whole of life into the pūjā: “You are
    my Self, Girijā my intellect, my prāṇas your attendants, my body your temple. Every enjoyment is your
    worship and sleep is samādhi; every step I walk is a pradakṣiṇa and every word I speak a hymn. Whatever
    I do, Śambhu, all of it is Your worship.” The last verse asks forgiveness for every fault of hand
    and foot, speech and body, done or left undone.'
stotra/shiva/shiva-panchakshara-stotram:
  text: The Śiva Pañcākṣara Stotram of Ādi Śaṅkarācārya — five verses, one for each syllable of 'na-maḥ-śi-vā-ya'.
stotra/shiva/shiva-pratah-smarana-stotram:
  text: A morning remembrance (prātaḥ-smaraṇa) of Śiva, in the Vasantatilakā metre.
stotra/shiva/shiva-sahasranama-stotram:
  text: The Śiva Sahasranāma from the Mahābhārata — a thousand names of Śiva, taught by the sage Upamanyu,
    in the Anuṣṭubh metre.
stotra/shiva/shiva-sahasranama-stotram--vishnu-krtam:
  text: From the Liṅga Purāṇa (Pūrva-bhāga, chapter 98). To gain a weapon against the asuras, Viṣṇu worships
    Śiva with a thousand names, offering a lotus at each name. When one lotus is found missing, he offers
    his own lotus-like eye in its place; pleased, Śiva gives him the Sudarśana cakra. It is a favourite
    on Pradoṣa evenings.
stotra/shiva/shivaparadha-kshamapana-stotram:
  text: The Śivāparādha-kṣamāpaṇa Stotram of Ādi Śaṅkarācārya — a prayer to Śiva for forgiveness of faults
    across a lifetime, in the Sragdharā metre.
stotra/shiva/shivaraksha-stotram:
  text: The Śivarakṣā Stotram, attributed to Yājñavalkya — a protective hymn to Śiva, in the Anuṣṭubh
    metre.
stotra/shiva/shivashivaa-stuti:
  text: The Śiva-Śivā Stuti — a hymn to Śiva and Pārvatī.
stotra/shiva/totakashtakam:
  text: The Toṭakāṣṭakam — Toṭakācārya's praise of his Guru, Ādi Śaṅkarācārya, in the Toṭaka metre that
    bears his name.
stotra/shiva/umamaheshwara-stotram:
  text: The Umāmaheśvara Stotram of Ādi Śaṅkarācārya — salutations to Śiva and Pārvatī together, 'namaḥ
    śivābhyām'.
stotra/subrahmanya/guha-pancharatnam:
  text: The Guha Pañcaratnam — five verses on Lord Subrahmaṇya (Guha), in the Anuṣṭubh metre.
stotra/subrahmanya/prajnavivardhana-karttikeya-stotram:
  text: A hymn to Kārttikeya for the growth of wisdom (prajñā), in the Anuṣṭubh metre.
stotra/subrahmanya/subrahmanya-ashtakam:
  text: The Subrahmaṇyāṣṭakam — 'he svāminātha karuṇākara dīnabandho' — eight verses on Lord Subrahmaṇya.
stotra/subrahmanya/subrahmanya-bhujangam:
  text: The Subrahmaṇya Bhujaṅgam of Ādi Śaṅkarācārya, in the Bhujaṅgaprayāta metre, composed at Tiruchendur.
stotra/subrahmanya/subrahmanya-bhujangam--paramashivendra-krtam:
  text: A Subrahmaṇya Bhujaṅgam composed by Śrī Paramaśivendra Sarasvatī, in the Bhujaṅgaprayāta metre.
stotra/subrahmanya/subrahmanya-pancharatnam:
  text: The Subrahmaṇya Pañcaratnam — five verses on Lord Subrahmaṇya.
stotra/subrahmanya/subrahmanya-shodasha-nama-stotram:
  text: Sixteen names of Lord Subrahmaṇya, from the Śaṅkara Saṁhitā, in the Anuṣṭubh metre.
stotra/venkatesha/venkatesha-ashtakam:
  text: The Veṅkaṭeśa Aṣṭakam, spoken by Brahmā, from the Brahmāṇḍa Purāṇa, in the Anuṣṭubh metre.
stotra/venkatesha/venkatesha-dwadasha-nama-stotram:
  text: Twelve names of Lord Veṅkaṭeśa.
stotra/venkatesha/venkatesha-karavalamba-stotram:
  text: The Veṅkaṭeśa Karāvalamba Stotram of Śrī Nṛsiṁha Bhāratī — seeking the Lord's supporting hand,
    in the Vasantatilakā metre.
stotra/venkatesha/venkatesha-mangalashasanam:
  text: The Veṅkaṭeśa Maṅgalāśāsanam — auspicious verses concluding the morning worship of Lord Veṅkaṭeśa.
stotra/venkatesha/venkatesha-prapatti:
  text: The Veṅkaṭeśa Prapatti — verses of surrender at the feet of Lord Veṅkaṭeśa, in the Vasantatilakā
    metre.
stotra/venkatesha/venkatesha-stotram:
  text: A hymn to Lord Veṅkaṭeśa in the Toṭaka metre, beginning 'kamalā-kuca-cūcuka-kuṅkumataḥ'.
stotra/venkatesha/venkatesha-suprabhatam:
  text: The Veṅkaṭeśa Suprabhātam — the morning stotram that awakens Lord Veṅkaṭeśa, beginning 'kausalyā
    suprajā rāma' (from Valmiki Ramayanam) followed by verses in the Vasantatilakā metre.
stotra/vishnu/brahmapaara-stotram:
  text: The Brahmapāra Stotram, from the Viṣṇu Purāṇa.
stotra/vishnu/dhanvatari-stotram:
  text: A hymn to Dhanvantari, the divine physician who arose from the churning of the milk-ocean, from
    the Matsya Purāṇa, in the Anuṣṭubh metre.
stotra/vishnu/kaishika-puranam:
  text: The Kaiśika Purāṇam, told by Lord Varāha to Bhūdevī, narrates how a devotee's singing in praise
    of the Lord redeemed a brahmarākṣasa.
stotra/vishnu/lakshmi-nrisimha-karunarasa-stotram:
  text: The Lakṣmī-Nṛsiṁha Karuṇārasa Stotram of Ādi Śaṅkarācārya, in the Vasantatilakā metre, with the
    refrain 'lakṣmī-nṛsiṁha mama dehi karāvalambam'.
stotra/vishnu/lakshmi-nrisimha-pancharatnam:
  text: The Lakṣmī-Nṛsiṁha Pañcaratnam of Ādi Śaṅkarācārya — five verses on turning the mind towards Lakṣmī-Nṛsiṁha.
stotra/vishnu/pandurangashtakam:
  text: The Pāṇḍuraṅgāṣṭakam of Ādi Śaṅkarācārya, in the Bhujaṅgaprayāta metre, on Viṭhṭhala of Paṇḍharpur
    standing on the brick by the Bhīmā river.
stotra/vishnu/ranganathashtakam:
  text: The Raṅganāthāṣṭakam, attributed to Ādi Śaṅkarācārya, on Lord Raṅganātha of Śrīraṅgam.
stotra/vishnu/sankashta-nashana-stotram:
  text: The Saṅkaṣṭanāśana Stotram — a prayer to Viṣṇu to remove difficulties.
stotra/vishnu/vishnu-bhujangaprayata-stotram:
  text: The Viṣṇu Bhujaṅgaprayāta Stotram of Ādi Śaṅkarācārya, in the Bhujaṅgaprayāta metre.
stotra/vishnu/vishnu-vijaya-stotram:
  text: The Viṣṇu Vijaya Stotram — a hymn in praise of Viṣṇu.
