gita/gita/chapter-01:
  text: Chapter 1 of the Bhagavad Gītā, Arjuna-viṣāda-yoga (the Yoga of Arjuna's Despondency). On the
    field of Kurukṣetra, Sañjaya describes to the blind king Dhṛtarāṣṭra the two armies arrayed for battle
    and the blowing of the conches. Arjuna asks Kṛṣṇa to draw his chariot between the armies, sees his
    teachers, kinsmen and friends on both sides, and overcome by grief and confusion, lays down his bow,
    refusing to fight.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-02:
  text: 'Chapter 2 of the Bhagavad Gītā, Sāṅkhya-yoga (the Yoga of Knowledge). Arjuna surrenders to Kṛṣṇa
    as a disciple, and the teaching begins: the Self is never born and never dies, and is not slain when
    the body is slain; one''s own duty (svadharma) is to be done; action is to be performed without attachment
    to its fruits (karmaṇy evādhikāras te). The chapter closes with the portrait of the sthita-prajña,
    the person of steady wisdom.'
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-03:
  text: Chapter 3 of the Bhagavad Gītā, Karma-yoga (the Yoga of Action). No one can remain without acting
    even for a moment; so act, but as an offering (yajña), without selfish attachment. Kṛṣṇa explains
    the cycle of sacrifice that sustains the world, the example the wise must set for others (loka-saṅgraha),
    that one's own duty imperfectly done is better than another's done well, and that desire born of rajas
    is the enemy to be conquered.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-04:
  text: Chapter 4 of the Bhagavad Gītā, Jñāna-karma-sannyāsa-yoga (the Yoga of Knowledge and the Renunciation
    of Action). Kṛṣṇa reveals that this yoga was taught of old to Vivasvān, and that He takes birth age
    after age to protect the good and establish dharma (yadā yadā hi dharmasya). He teaches seeing inaction
    in action, describes the many forms of sacrifice, and declares knowledge the supreme purifier, to
    be gained by reverence, inquiry and service to the wise.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-05:
  text: 'Chapter 5 of the Bhagavad Gītā, Karma-sannyāsa-yoga (the Yoga of Renunciation). Arjuna asks which
    is better, renouncing action or performing it. Kṛṣṇa answers that both lead to the highest, but action
    without attachment is superior: the yogī works like a lotus leaf untouched by water, sees the same
    Self in a learned brāhmaṇa, a cow, an elephant, a dog and an outcaste, and finds the peace of Brahman
    within.'
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-06:
  text: 'Chapter 6 of the Bhagavad Gītā, Ātma-saṁyama-yoga (the Yoga of Meditation). Lift yourself by
    yourself — the mind is both friend and enemy. Kṛṣṇa describes the practice of meditation: the seat,
    the posture, moderation in food and sleep, the mind steady as a lamp in a windless place. To Arjuna''s
    doubt that the restless mind cannot be held, He answers: by practice and dispassion; and no one who
    does good ever comes to grief, even if the effort is left unfinished.'
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-07:
  text: 'Chapter 7 of the Bhagavad Gītā, Jñāna-vijñāna-yoga (the Yoga of Knowledge and Realisation). Kṛṣṇa
    describes His lower nature (the eight elements of matter) and His higher nature (the life that sustains
    the world): all this is strung on Him like pearls on a thread. Four kinds of people worship Him —
    the distressed, the seeker of knowledge, the seeker of wealth, and the wise; the wise one, who after
    many births knows that Vāsudeva is all, is very rare.'
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-08:
  text: Chapter 8 of the Bhagavad Gītā, Akṣara-brahma-yoga (the Yoga of the Imperishable Brahman). Arjuna
    asks what Brahman, adhyātma, karma, adhibhūta and adhidaiva are. Kṛṣṇa explains them and teaches that
    whatever one remembers at the moment of death, to that one goes — so remember Him at all times and
    fight. He describes the cycles of the days and nights of Brahmā, and the two paths by which souls
    depart.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-09:
  text: 'Chapter 9 of the Bhagavad Gītā, Rāja-vidyā-rāja-guhya-yoga (the Yoga of the Royal Knowledge and
    Royal Secret). The whole universe is pervaded by Kṛṣṇa''s unmanifest form, yet He stands apart. Whatever
    is offered with love — a leaf, a flower, a fruit, water (patraṁ puṣpaṁ phalaṁ toyam) — He accepts;
    whoever worships Him with undivided devotion, He carries their burden. Even the gravest sinner who
    turns to Him is soon righteous: ''My devotee never perishes.'''
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-10:
  text: Chapter 10 of the Bhagavad Gītā, Vibhūti-yoga (the Yoga of Divine Manifestations). Kṛṣṇa declares
    Himself the source of all, and Arjuna praises Him as the Supreme Brahman and asks to hear His glories.
    Kṛṣṇa lists His chief manifestations — among the Ādityas Viṣṇu, among lights the sun, among rivers
    the Gaṅgā, among the Pāṇḍavas Arjuna — and concludes that whatever is glorious, beautiful or mighty
    springs from a spark of His splendour.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-11:
  text: 'Chapter 11 of the Bhagavad Gītā, Viśvarūpa-darśana-yoga (the Vision of the Cosmic Form). Granted
    divine sight, Arjuna beholds Kṛṣṇa''s universal form — countless faces, eyes and arms, the radiance
    of a thousand suns — and sees the warriors of both armies rushing into His mouths. ''I am Time, the
    destroyer of worlds'': Arjuna is to be merely the instrument. Terrified and awed, Arjuna praises Him
    and begs to see again the gentle four-armed and human form. Much of this chapter is in the Triṣṭubh
    metre.'
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-12:
  text: Chapter 12 of the Bhagavad Gītā, Bhakti-yoga (the Yoga of Devotion). Arjuna asks who is better
    — those who worship the personal Lord or the unmanifest Imperishable. Kṛṣṇa answers that both reach
    Him, but the path of the unmanifest is harder for the embodied; He gives a ladder of practice for
    those who cannot fix their mind on Him at once, and closes with the beloved qualities of His devotee
    — without hatred, friendly and compassionate, the same in honour and dishonour.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-13:
  text: 'Chapter 13 of the Bhagavad Gītā, Kṣetra-kṣetrajña-vibhāga-yoga (the Field and the Knower of the
    Field). The body is the field, and He who knows it is the knower of the field — and Kṛṣṇa is the knower
    in all fields. He lists the virtues that constitute knowledge, describes the Brahman that is to be
    known, and explains prakṛti and puruṣa: whoever sees the Lord dwelling equally in all beings, imperishable
    among the perishing, truly sees.'
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-14:
  text: 'Chapter 14 of the Bhagavad Gītā, Guṇa-traya-vibhāga-yoga (the Three Guṇas). Kṛṣṇa explains how
    the three qualities of nature — sattva, rajas and tamas — bind the embodied soul: sattva by attachment
    to happiness and knowledge, rajas by attachment to action, tamas by delusion and sloth. Asked about
    the one who has transcended them, He describes the guṇātīta — equal in pleasure and pain, praise and
    blame — who serves Him with unwavering devotion.'
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-15:
  text: Chapter 15 of the Bhagavad Gītā, Puruṣottama-yoga (the Supreme Person). The world is an eternal
    aśvattha tree with roots above and branches below, to be cut down with the axe of detachment. Kṛṣṇa
    is the light of the sun and moon, the digestive fire in all beings, seated in every heart; beyond
    the perishable and the imperishable, He is the Supreme Person, the Puruṣottama. This short chapter
    is traditionally recited before meals.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-16:
  text: Chapter 16 of the Bhagavad Gītā, Daivāsura-sampad-vibhāga-yoga (the Divine and Demoniac Natures).
    Kṛṣṇa lists the divine qualities that lead to liberation — fearlessness, purity, charity, self-control,
    non-violence, truthfulness, compassion — and the demoniac ones that lead to bondage — hypocrisy, arrogance,
    anger and harshness. Lust, anger and greed are the three gates of hell; so let the scripture be your
    authority in deciding what to do.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-17:
  text: 'Chapter 17 of the Bhagavad Gītā, Śraddhā-traya-vibhāga-yoga (the Three Kinds of Faith). Faith
    takes the form of one''s nature: sāttvika, rājasa or tāmasa. Kṛṣṇa describes the three kinds of food,
    sacrifice, austerity (of body, speech and mind) and charity, and ends with the meaning of ''Om Tat
    Sat'', the threefold designation of Brahman.'
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gita/chapter-18:
  text: 'Chapter 18 of the Bhagavad Gītā, Mokṣa-sannyāsa-yoga (Liberation through Renunciation). Kṛṣṇa
    distinguishes renunciation (sannyāsa) from relinquishment (tyāga), analyses knowledge, action, doer,
    intellect, resolve and happiness by the three guṇas, and teaches that one attains perfection by worshipping
    Him through one''s own duty. Then the final word: ''Abandon all dharmas and take refuge in Me alone;
    I will free you from all sins — do not grieve.'' Arjuna''s delusion is gone, and Sañjaya closes: where
    Kṛṣṇa and Arjuna are, there are fortune, victory and justice.'
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/gsa:
  text: 'The Gītārtha-saṅgraha of Śrī Yāmunācārya (Āḷavandār), the great Śrīvaiṣṇava teacher: 32 verses
    summarising the meaning of the Bhagavad Gītā. It describes the Gītā''s aim as Nārāyaṇa, attainable
    only through devotion arising from one''s duty, knowledge and detachment; treats the three hexads
    of chapters (karma and jñāna yoga, bhakti yoga, and their synthesis); and gives the purport of each
    of the eighteen chapters in turn, ending with the four kinds of devotees and the glory of the jñānī.'
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
gita/mahatmyam:
  text: 'Seven verses on the greatness of the Gītā, traditionally chanted after the text: whoever reads
    this holy scripture with care attains the abode of Viṣṇu; a single bath in the waters of the Gītā
    washes away the dirt of saṁsāra; all the Upaniṣads are cows, the son of Nanda the milker, Arjuna the
    calf, and the Gītā the nectar-milk; one scripture, the song of Devakī''s son; one God, Devakī''s son;
    one mantra, His names; one duty, His service.'
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/ganesha/ganapati-stava:
  text: The Gaṇapati Stava, attributed to the sage Garga, in the Bhujaṅgaprayāta metre, praises Gaṇapati
    as the formless, changeless Supreme.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/ganesha/ganashtakam:
  text: The Gaṇāṣṭakam — eight verses on Gaṇeśa, in the Anuṣṭubh metre.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/ganesha/mahaganapati-navarnavedapada-stava:
  text: The Mahāgaṇapati Navārṇa-vedapāda Stava — a hymn to Mahāgaṇapati, in the Anuṣṭubh metre.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/guru/kanchi-kamakoti-guru-parampara-stava:
  text: Śrī Kāñcī Kāmakoṭi Pīṭha, the Sarvajña Pīṭha at Kāñcīpuram, was established by Śrī Ādi Śaṅkara
    Bhagavatpāda (Kalyabda 2621, 482 BCE), and its unbroken line of Jagadgurus continues to this day under
    the 70th Pīṭhādhipati, Śrī Śaṅkara Vijayendra Sarasvatī Śaṅkarācārya Svāmigal, and His śiṣya, the
    71st Jagadguru, Śrī Satya Candraśekharendra Sarasvatī Svāmigal. In this stava the 65th Jagadguru,
    Śrī Sudarśana Mahādevendra Sarasvatī Śrīcaraṇa, bows to that Guru-paramparā in simple Anuṣṭubh verses,
    recording some details not found in the earlier texts; the appendix verses (one of them by the 69th
    Jagadguru, Śrī Jayendra Sarasvatī Śrīpāda) salute the Jagadgurus who followed. It is one of the four
    traditional pramāṇa texts on the lineage, with the Puṇyaśloka-mañjarī (Śrī Sadāśiva Bodhendra Sarasvatī,
    the 56th Jagadguru), the Jagadguru-ratnamālā (Śrī Sadāśiva Brahmendra) and its commentary Suṣamā (Śrī
    Ātmabodhendra Sarasvatī).
  source: Edited by you in review
stotra/krishna/akrurakrta-dashavatara-stuti:
  text: From the Śrīmad Bhāgavatam (Skandha 10, Adhyāya 40). Kaṃsa has sent Akrūra to Vraja to bring Kṛṣṇa
    and Balarāma to Mathurā. On the way back, Akrūra stops at the Yamunā for his midday bath, and under
    the water he sees the two boys; looking again, he sees Viṣṇu reclining on Ādiśeṣa, attended by sages
    and devas. Overwhelmed, he praises the Lord, and in these six verses he salutes Him in each of His
    avatāras, from Matsya to Kalki.
  source: 'Revised in review: Bhāgavata source and juncture (from the colophon)'
  notes: Skandha and adhyāya are from the stotra's own colophon; the juncture is the well-known narrative
    of that chapter, written from memory, so please check it against the text.
stotra/krishna/balamukundashtakam:
  text: The Bālamukundāṣṭakam — eight verses on the child Kṛṣṇa, beginning with the beloved image of the
    baby who places His lotus-foot in His lotus-mouth.
  source: Edited by you in review
stotra/krishna/balaraksha:
  text: 'From the Śrīmad Bhāgavatam (Skandha 10, Adhyāya 6). The infant Kṛṣṇa has just slain the demoness
    Pūtanā, who came to Gokula to nurse Him with poisoned milk. Shaken, the gopīs guard the child as mothers
    do: they wave a cow''s tail over Him, bathe Him and mark His limbs, and place the Lord''s names on
    each part of His body (“May Aja protect your feet, Maṇimān your knees…”), praying that every harm
    flee at the sound of Viṣṇu''s names. Here those protective verses are preceded by a few dhyāna-ślokas.'
  source: 'Revised in review: Bhāgavata source and juncture (from the colophon)'
  notes: Skandha and adhyāya are from the stotra's own colophon; the juncture is the well-known narrative
    of that chapter, written from memory, so please check it against the text.
stotra/krishna/bhishma-stuti:
  text: 'From the Śrīmad Bhāgavatam (Skandha 1, Adhyāya 9). The war is over. Bhīṣma lies on his bed of
    arrows at Kurukṣetra, waiting for the sun to turn north before he gives up his body. Yudhiṣṭhira comes
    with his brothers and Śrī Kṛṣṇa, and after Bhīṣma has taught him dharma, the moment arrives. Gazing
    at Kṛṣṇa standing before him, Bhīṣma offers this praise: he recalls the Lord as Arjuna''s charioteer,
    His face dusted by the battle, and the time He broke His own vow and rushed at Bhīṣma wheel in hand
    to keep His devotee''s word. Then, his mind fixed on Kṛṣṇa, he passes away.'
  source: 'Revised in review: Bhāgavata source and juncture (from the colophon)'
  notes: Skandha and adhyāya are from the stotra's own colophon; the juncture is the well-known narrative
    of that chapter, written from memory, so please check it against the text.
stotra/krishna/damodarashtakam:
  text: The Dāmodarāṣṭakam, from the Padma Purāṇa, in the Bhujaṅgaprayāta metre, celebrates the child
    Kṛṣṇa bound to the mortar by Yaśodā.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/krishna/dhruvakrta-bhagavat-stavam:
  text: From the Śrīmad Bhāgavatam (Skandha 4, Adhyāya 9), in the Vasantatilakā metre. The five-year-old
    prince Dhruva, turned away from his father's lap by his stepmother Suruci, goes to the forest of Madhuvana
    and, on Nārada's instruction, worships Viṣṇu with severe penance. When the Lord appears before him
    on Garuḍa, the child stands with folded hands, unable to speak. Viṣṇu touches his cheek with His conch,
    and at once the words of this praise flow from him.
  source: 'Revised in review: Bhāgavata source and juncture (from the colophon)'
  notes: Skandha and adhyāya are from the stotra's own colophon; the juncture is the well-known narrative
    of that chapter, written from memory, so please check it against the text.
stotra/krishna/govindashtakam:
  text: The Govindāṣṭakam — eight verses on Śrī Kṛṣṇa as Govinda, composed by Ādi Śaṅkarācārya.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/krishna/guruvatapurisha-pancharatnam:
  text: The Guruvātapurīśa Pañcaratnam — five verses on the Lord of Guruvāyūr, composed by Anantarāma
    Dīkṣita.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/krishna/krishna-dwadasha-nama-stotram:
  text: The Kṛṣṇa Dvādaśa-nāma Stotram — twelve names of Śrī Kṛṣṇa, from the Mahābhārata, in the Anuṣṭubh
    metre.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/krishna/krishna-jananam:
  text: 'From the Śrīmad Bhāgavatam (Skandha 10, Adhyāya 3). At midnight, in Kaṃsa''s prison at Mathurā,
    Kṛṣṇa is born to Devakī and Vasudeva, and all nature rejoices. Vasudeva beholds the wondrous child:
    lotus-eyed and four-armed, holding the conch, discus, mace and lotus, with the Śrīvatsa on His chest
    and the Kaustubha at His throat, shining in yellow silk, crown and earrings.'
  source: 'Revised in review: Bhāgavata source and juncture (from the colophon)'
  notes: Skandha and adhyāya are from the stotra's own colophon; the juncture is the well-known narrative
    of that chapter, written from memory, so please check it against the text.
stotra/krishna/krishna-nama-mahatmyam:
  text: From the Skanda Purāṇa, on the greatness of chanting the names of Śrī Kṛṣṇa, in the Anuṣṭubh metre.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/krishna/krishnashtakam1:
  text: A Kṛṣṇāṣṭakam — eight verses composed by Ādi Śaṅkarācārya in the Śikhariṇī metre.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/krishna/krishnashtakam2:
  text: A Kṛṣṇāṣṭakam — eight verses on Śrī Kṛṣṇa, composed by Ādi Śaṅkarācārya.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/krishna/krishnashtakam3:
  text: The popular Kṛṣṇāṣṭakam — 'vasudeva-sutaṁ devam' — eight verses ending 'kṛṣṇaṁ vande jagadgurum',
    in the Anuṣṭubh metre.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/krishna/narayana-keshadipadanta-varnanam:
  text: A description of Nārāyaṇa from head to foot, in the Sragdharā metre, from the Nārāyaṇīyam.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/krishna/santanagopala-stotram:
  text: The Santāna Gopāla Stotram, in the Anuṣṭubh metre, is a prayer to Śrī Kṛṣṇa as Gopāla for the
    blessing of children.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/krishna/vatapuranatha-ashtakam:
  text: The Vātapuranāthāṣṭakam — eight verses on Śrī Kṛṣṇa, the Lord of Guruvāyūr.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/lakshmi/kanakadhara-stavam:
  text: The Kanakadhārā Stavam — composed by Ādi Śaṅkarācārya in the Vasantatilakā metre, at whose recitation
    Goddess Lakṣmī is said to have showered golden fruits on a poor household.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/lakshmi/lakshmi-stotram:
  text: Indra's praise of Goddess Lakṣmī, from the Viṣṇu Purāṇa, in the Anuṣṭubh metre.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/lakshmi/mahalakshmi-stuti:
  text: Agastya's praise of Goddess Mahālakṣmī, largely in the Vasantatilakā metre.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/lakshmi/mahalakshmyashtakam:
  text: The Mahālakṣmyaṣṭakam — eight verses on Goddess Mahālakṣmī, spoken by Indra, from the Padma Purāṇa,
    in the Anuṣṭubh metre.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/nadi/ganga-stuti:
  text: A hymn to the Gaṅgā, recited on Gaṅgā Daśaharā.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/nadi/gangakarshanashtakam:
  text: The Gaṅgākarṣaṇāṣṭakam — eight verses in the Indravajrā metre.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/nadi/gangashtakam:
  text: The Gaṅgāṣṭakam — eight verses in praise of the holy river Gaṅgā.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/nadi/kaveri-prarthana:
  text: A short prayer to the river Kāverī, in the Anuṣṭubh metre.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/nadi/narmadashtakam:
  text: The Narmadāṣṭakam — composed by Ādi Śaṅkarācārya in the Pañcacāmara metre, with its flowing refrain
    'tvadīya pāda-paṅkajaṁ namāmi devi narmade'.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/nadi/triveni-stotram:
  text: A hymn to the Triveṇī, the confluence of the Gaṅgā, Yamunā and Sarasvatī.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/nadi/yamunashtakam:
  text: The Yamunāṣṭakam — eight verses in praise of the river Yamunā.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/navagraha/aditya-hrdayam:
  text: The Āditya Hṛdayam — the hymn to the Sun that the sage Agastya taught Śrī Rāma on the battlefield
    before his final battle with Rāvaṇa. From the Śrīmad Rāmāyaṇa, in the Anuṣṭubh metre.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/navagraha/angaraka-stotram:
  text: A hymn to Aṅgāraka (Mars), from the Skanda Purāṇa, in the Anuṣṭubh metre.
  source: Vani YouTube description (pipeline/youtube_blurbs.tsv)
stotra/navagraha/brihaspati-stotram:
  text: A hymn to Bṛhaspati (Jupiter), from the Skanda Purāṇa, in the Anuṣṭubh metre.
