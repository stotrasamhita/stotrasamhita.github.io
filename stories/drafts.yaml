stotra/shiva/charanashringarahita-nataraja-stotram:
  text: 'The Caraṇa-śṛṅga-rahita Naṭarāja Stotram: ten verses to the dancing Śiva of Chidambaram, attributed
    to the sage Patañjali, traditionally the divine serpent Ādiśeṣa. The closing verse calls it the work
    of "the best of serpents" (*bhujaga-puṅgava*) and describes it as "without foot or horn" (*caraṇa-śṛṅga-rahitam*).


    True to its name, the hymn has no long vowel at all: no ā, ī, ū, e, ai, o or au, the signs that in
    Devanāgarī carry a "foot" or a "horn". Heavy syllables are made with anusvāra and conjuncts instead,
    which gives the verses their jingling, rolling gait: *sadañcita-mudañcita-nikuñcita-padaṃ…*


    Why "without feet and horns"? The traditional account is that Nandi, Śiva''s bull, who has both feet
    and horns, would not let Patañjali, who has neither, in to see the Lord. Patañjali answered by singing
    a hymn with neither. Some tellings give the role to Vyāghrapāda, the tiger-footed sage. We have not
    found this story in an early text. The scholar-monk Swami Kāśikānanda Giri, in his Sanskrit commentary,
    reads the name another way: "without beginning or end", like Śiva himself, whose pillar of fire Brahmā
    and Viṣṇu could never measure.'
  source: Research in the vagdhenu session, 4 October 2026 (drafted for the YouTube description; the video
    is still unlisted)
  notes: 'Checked: none of the 40 verse lines contains a long vowel. The closing-verse claim is quoted
    from our own text (verse 10).

    The three attributions are hedged on purpose. Your version (Vyāghrapāda mocks the caraṇa, Nandi the
    śṛṅga) was not found in any written source; it may be an oral tradition, so a Chidambaram dīkṣita
    or a Tamil source might know it.

    Ruled out: Rāmabhadra Dīkṣita''s Patañjalicarita (Nandi only guards the door), the Chidambara Māhātmya
    as summarised online, Wikipedia''s Vyāghrapāda article, Deivathin Kural.

    Unread lead: Chandrakalā''s commentary (Bharati Saṃskṛta Vidyā Niketanam, 1992), to whose translator
    the Nandi story is credited.'
