stotra/rama/ahalyakrta-rama-stotram:
  text: 'From the Adhyātma Rāmāyaṇa (Bāla Kāṇḍa). Viśvāmitra is leading Rāma and Lakṣmaṇa to Mithilā when
    they come upon the silent, deserted āśrama of the sage Gautama. Viśvāmitra tells its story: Indra,
    in Gautama''s form, had come to Ahalyā, and the sage cursed his wife to remain there unseen, enduring
    sun and rain, until Rāma should come. At the touch of Rāma''s feet Ahalyā rises, freed, and sees before
    her the Lord whose feet Brahmā and Śaṅkara long to touch: “I am blessed, O refuge of the worlds, for
    I touch what they seek.” She marvels that He who has no feet ever moves, and asks for one boon only:
    that wherever she may be, her devotion stay fixed at His lotus feet. Then, having circled Him and
    bowed, she goes with His leave to her husband.


    The phala-śruti promises that whoever reads this hymn of Ahalyā with devotion is freed of all sins
    and reaches the supreme Brahman; that one who chants it for a child, holding Rāma in the heart, is
    blessed within a year with a good son, even if childless; that all desires are fulfilled by Rāmacandra''s
    grace; and that even one stained by the gravest sins is purified by chanting it daily, remembering
    Raghupati with devotion.'
  source: 'Revised in review: Adhyātma Rāmāyaṇa context and phala-śruti'
  notes: 'Ahalyā''s words, the boon, the leave-taking (v. 19) and the phala (vv. 20–23) are from our text.
    The setting and the curse are from memory of the Bāla Kāṇḍa (sarga 5), so please check: the Adhyātma''s
    own wording of the curse differs from Vālmīki''s.'
