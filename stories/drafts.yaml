stotra/shakti/muka-sarah:
  text: 'The Mūkasāra, “the essence of Mūka”, is a garland of verses from the Mūka Pañcaśatī, the five
    hundred verses on Kāmākṣī of Kāñcī by the poet Mūka. The selection was made by the Paramācārya of
    Kāñcī, Śrī Candraśekharendra Sarasvatī, and a few more popular verses are added here (shown in brackets:
    Āryā Śataka 1 and 100, and Stuti Śataka 6).


    Its forty verses are ordered by the five śatakas they come from, and each verse is marked with its
    śataka and number:


    - **Āryā Śataka** (8 verses), in the short āryā metre: Her form as Compassion itself, playing in Kāñcī''s
    Kāma-pīṭha, and the closing *jaya jaya jagadamba śive*.

    - **Pādāravinda Śataka** (8): Her lotus feet, a boat on the ocean of saṃsāra and the giver of fame,
    wealth and poetry.

    - **Stuti Śataka** (10): praise of the Devī and of Kāñcī.

    - **Kaṭākṣa Śataka** (8): the grace of Her sidelong glance.

    - **Mandasmita Śataka** (6): Her gentle smile. The last verse joins the five themes: one who meditates
    on the āryā, beholds Her feet, begins Her praise and receives Her glance rises on the waves of Her
    smile to the mansion of liberation.'
  source: Your review comment; śataka order and verse numbers from our text
  notes: 'Revised per your comment: composed (compiled) by the Paramācārya, popular verses added, ordered
    by śataka.'
stotra/shakti/parashurama-krta-durga-stotram:
  text: 'From the Brahmavaivarta Purāṇa (Gaṇapati Khaṇḍa, Adhyāya 45), as Nārāyaṇa tells it to Nārada.
    Paraśurāma, a disciple of Śiva, praises Durgā as the wife of his guru. It is the episode in which,
    at the gates of Kailāsa, he struck Gaṇeśa with his axe and broke a tusk, making Him Ekadanta, and
    so angered Pārvatī.


    His praise begins in Goloka, at the dawn of creation, where the supreme Devī emerges from the body
    of the all-complete Śrī Kṛṣṇa. As Rādhā, the Mūla-prakṛti, She becomes the source of the cosmic Virāṭ,
    and then takes five forms: Rādhā, Sāvitrī, Lakṣmī, Sarasvatī and Durgā. Every goddess and every wife
    of a god or sage is a portion of Her portion, and so is the light in the sun, the heat in fire, the
    coolness of water and the fragrance of earth. Brahmā, Viṣṇu and Śiva themselves praised Her in their
    need, against Madhu and Kaiṭabha and in the war with Tripura. He ends like a child before his mother:
    *what mother is angered by the faults of her children?*


    Paraśurāma bows and weeps, and Durgā, pleased, blesses him: be immortal, victorious everywhere, devoted
    to Kṛṣṇa and to Śiva your guru. No one can harm one whose devotion to his chosen deity and guru is
    constant.


    The phala-śruti calls it a *stotra-rāja* of the Kāṇva śākhā. Read at the time of pūjā, at the start
    of a journey or in the morning, it grants one''s wish: a son, a daughter, learning or children; a
    lost kingdom or lost wealth regained; the anger of guru, god, king or kin turned to favour; release
    from robbers, serpents, enemies, illness, prison and the deep waters. Above all it is for women longing
    for children: listening to it for a year, after worshipping Durgā, brings a long-lived, wise son,
    and listening for six months brings good fortune.'
  source: Our text (vv. 1–59) and the colophon; the WA Navarātri post (vagdhenu session)
  notes: The tusk episode (the setting) is from my knowledge of the Gaṇapati Khaṇḍa, not from our text;
    the text itself only says he praises his guru's wife. Please check.
stotra/shakti/shashthi-devi-stotram:
  text: 'From the Brahmavaivarta Purāṇa (Prakṛti Khaṇḍa), in the story of Ṣaṣṭhī as Nārāyaṇa tells it
    to Nārada. Ṣaṣṭhī Devī is the presiding goddess of children (*bālādhiṣṭhātṛ-devī*), the sixth portion
    of the Śakti, and Devasenā, the beloved of Skanda. King Priyavrata, son of Svāyambhuva Manu, praises
    Her: Giver of boons, sons and wealth, ever present to Her devotees, free of violence and anger. He
    asks: “Give wealth, give a beloved wife, give a son; give dharma, fame, land, children, learning,
    welfare and victory.” Having praised Her, he receives a glorious son, a king among kings, by Her grace.


    The phala-śruti:


    - One without a son who listens to the hymn for a year gains a fine, long-lived son.

    - A woman who listens with devotion and restraint for a year is freed of all sins and gives birth,
    even if long barren, to a son who is brave, virtuous, learned, famous and long-lived.

    - A woman who bore only one child (*kāka-vandhyā*) or whose children did not survive is blessed with
    a son after a year of listening.

    - When a child is ill and the father and mother listen to it, the child recovers within a month.'
  source: Our text (vv. 1–15) and the colophon
  notes: Added the phala-śruti per your comment. That Priyavrata is the son of Svāyambhuva Manu is from
    my knowledge, not our text.
stotra/shakti/yudhishthira-krta-durga-stotram:
  text: 'From the Mahābhārata, Virāṭa Parva (Pāṇḍava-praveśa Parva, Adhyāya 8). The Pāṇḍavas'' twelve
    years in the forest are over, and the thirteenth, to be lived unrecognised, is about to begin. As
    they set out for Virāṭa''s city, Yudhiṣṭhira prays in his mind to Durgā, Queen of the three worlds.


    He hails Her as the One born of Yaśodā in Nanda''s house, dear to Nārāyaṇa. Kaṃsa dashed Her against
    a rock, and She rose into the sky. She is the Sister of Vāsudeva, bearing sword and shield, dark like
    Kṛṣṇa, with a face like Saṅkarṣaṇa''s. She has dwelt forever on the Vindhya, slayer of Mahiṣa: *because
    You carry people across difficulty (durga), You are called Durgā*. Those lost in forests, sinking
    in the ocean or held by robbers have Her as their refuge. Fallen from his kingdom, the king takes
    refuge in Her: “Be my refuge, O Durgā, kind to Your devotees.”


    The Devī appears before him. She promises victory in battle, the kingdom won back with his brothers,
    and health and joy. The Kauravas and the people of the city will not recognise the Pāṇḍavas while
    they live in Virāṭa''s city. Whoever remembers Her as he did, in exile, in battle, in forest, sea
    or mountain, will find nothing out of reach, and whoever hears or reads this hymn with devotion will
    see all their work succeed. Then, having placed the Pāṇḍavas under Her protection, She vanishes.'
  source: Our text (vv. 1–36) and the WA Navarātri post (vagdhenu session)
  notes: Revised from the WA Navarātri post and the text.
stotra/shatanama/lakshmi-ashtottara-shatanama-stotram:
  text: 'The 108 names of Lakṣmī, opening with *prakṛtiṃ vikṛtiṃ vidyām*: She is both Nature and all its
    forms. She is Padmā, the lotus-dweller, born of the Ocean of Milk and sister of the moon, who dwells
    on Viṣṇu''s chest and destroys poverty.


    The phala-śruti calls it the *dāridrya-mocana*, the hymn that frees one from poverty:


    - One who chants it three times a day for six months with the senses controlled destroys poverty and
    gains everything without effort.

    - Among the Devī''s thousands of names these 108 are especially holy: by them even one poor for a
    crore of births gains prosperity.

    - Read a hundred times on Fridays for a year, it brings the eight kinds of wealth, like Kubera''s
    on earth.

    - Having enjoyed abundant blessings, one finally attains union with Her. Read every morning, meditating
    on Her adorned with every ornament, it quiets all sorrow.'
  source: Our text, phala-śruti vv. 17–21
  notes: Added the phala-śruti per your comment; dropped 'taught by Śiva', which our text does not state.
stotra/shatanama/lakshmi-narayana-ashtottara-shatanama-stotram:
  text: 'The 108 names of Lakṣmī and Nārāyaṇa, alternating beautifully between the two. Each name of Śrī
    is followed by one of Viṣṇu, so the Divine Couple are praised together, name by name: *śrīr viṣṇuḥ
    kamalā śārṅgī lakṣmīr vaikuṇṭha-nāyakaḥ*, “Śrī, Viṣṇu; Kamalā, the bearer of the Śārṅga bow; Lakṣmī,
    the Lord of Vaikuṇṭha.” Often a pair answers each other: Padmālayā and the four-armed One, Daughter
    of the Milk Ocean and Acyuta, Rukmiṇī and the slayer of Keśi, Jayapradā and Jayakara. The single closing
    verse promises that one who reads these 108 names on rising in the morning will always be victorious.'
  source: Our text
  notes: Added the alternation per your comment.
