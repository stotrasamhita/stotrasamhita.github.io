stotra/navagraha/dwadasharya-surya-stuti:
  text: 'Twelve verses in the Āryā metre on Surya. It opens with a prayer that echoes the Ṛgveda: “May
    Sūrya, rising today and ascending the northern sky, swiftly dispel the disease of my heart and my
    pallor.” The second verse salutes the Lord of the lotuses, who crosses two thousand two hundred and
    two yojanas in half a twinkling of the eye; the third sees him as the twelve-fold one who moves through
    the world as the ten organs of action and knowledge, the mind and the jīva. He is the Yajus, the Ṛk
    and the Sāman, the Āgama and the sacred vaṣaṭ, the haṃsa and the paramahaṃsa; and from his several
    forms the devotee asks for knowledge, liberation, prosperity and health.'
  source: Edited by you in review
  notes: Verses 1–5 checked against our text (verse 1 is RV 1.50.11). No composer is named in the TeX,
    so none is given.
