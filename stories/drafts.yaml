  - http://loveofyogis.blogspot.com/2017/11/nataraja-stotram-patanjali.html
  - https://groups.google.com/g/telugu-unicode/c/qQYd9BWmjU0
  - https://www.kamakoti.org/tamil/Kural72.htm
