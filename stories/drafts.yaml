stotra/shakti/arjuna-krta-durga-stuti:
  text: 'From the Mahābhārata, Bhīṣma Parva (Gītā Parva, Adhyāya 23), just before the Gītā itself. Sañjaya
    tells Dhṛtarāṣṭra how, with the armies drawn up at Kurukṣetra, Śrī Kṛṣṇa said to Arjuna: “Purify yourself
    and recite the Durgā stotra for the defeat of your enemies.” Arjuna steps down from his chariot and
    prays with folded hands to Durgā: leader of the Siddhas'' host, dweller on Mandara, Kumārī, Kālī,
    Bhadrakālī, Kātyāyanī, Vijayā and Jayā.


    The Devī, moved by his devotion, speaks from the sky in front of Govinda: “You will soon conquer your
    enemies, Pāṇḍava. You are Nara, with Nārāyaṇa as your ally, unconquerable even by Indra.” Arjuna takes
    it as his victory and mounts the chariot, and Kṛṣṇa and Arjuna blow their divine conches.


    Whoever recites the hymn on rising at dawn has no fear of yakṣas, rākṣasas, piśācas, enemies, serpents
    or the king''s court. They win disputes, are freed from bonds, cross every difficulty, escape thieves,
    are always victorious in battle and gain Lakṣmī. They live a hundred years in health and strength.
    The chapter closes with the famous words *yato dharmas tataḥ kṛṣṇo yataḥ kṛṣṇas tato jayaḥ*: “where
    there is dharma there is Kṛṣṇa, and where Kṛṣṇa is, there is victory.”'
  source: Our text (vv. 1–28) and the WA Navarātri post (vagdhenu session)
  notes: Improved from the WA Navarātri post and the text.
